name: Adjust X mainnet tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: adjust-x-mainnet-tests
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/automatic-x-posts
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python scripts/adjust_x_mainnet_tests.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Adjust X credential test for mainnet gate"
          git push origin HEAD:agent/automatic-x-posts
