name: Apply blockchain repair

on:
  push:
    branches:
      - agent/restore-blockchain-flows

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: agent/restore-blockchain-flows
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: helpers/package-lock.json

      - name: Apply source repair
        run: python tools/apply_blockchain_repair.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm ci --prefix helpers

      - name: Run full validation
        run: |
          python -m pytest -q
          npm test --prefix helpers
          ruff check .
          python -m compileall -q *.py tests
          for file in static/*.js; do node --check --input-type=module < "$file"; done
          for file in helpers/*.mjs; do node --check "$file"; done
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader
          environment = Environment(loader=FileSystemLoader(Path('templates')))
          for path in sorted(Path('templates').glob('*.html')):
              environment.get_template(path.name)
          PY

      - name: Remove temporary repair machinery
        run: |
          rm -f tools/apply_blockchain_repair.py
          rm -f .github/workflows/apply-blockchain-repair.yml

      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore blockchain transaction flows"
          git push origin HEAD:agent/restore-blockchain-flows
