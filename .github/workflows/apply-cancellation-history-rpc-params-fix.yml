name: Apply cancellation history RPC parameter fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: agent/fix-cancellation-history-rpc-params
          fetch-depth: 0

      - name: Apply focused source change
        run: python tools/apply_cancellation_history_rpc_params_fix.py

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: helpers/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm ci --prefix helpers

      - name: Run full validation
        run: |
          python -m pytest -q
          npm test --prefix helpers
          ruff check .
          python -m compileall -q *.py tests
          for file in static/*.js; do node --check --input-type=module < "$file"; done
          for file in helpers/*.mjs; do node --check "$file"; done
          for file in *.sh; do bash -n "$file"; done
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader
          environment = Environment(loader=FileSystemLoader(Path('templates')))
          for path in sorted(Path('templates').glob('*.html')):
              environment.get_template(path.name)
          PY
          NIMHUNT_DB_PATH="$RUNNER_TEMP/nimhunt-ci.db" \
          NIMHUNT_DEPLOYMENT_MODE=development \
          NIMHUNT_NIMIQ_NETWORK=TestAlbatross \
          NIMHUNT_NIMIQ_ALLOW_DEFAULT_TEST_MNEMONIC=1 \
          python spoof.py
          python -m pip check
          python -m pip_audit --progress-spinner off
          npm audit --omit=dev --prefix helpers

      - name: Remove temporary repair files
        run: |
          rm -f tools/apply_cancellation_history_rpc_params_fix.py
          rm -f tools/run_cancellation_history_rpc_params_fix.txt
          rm -f .github/workflows/apply-cancellation-history-rpc-params-fix.yml

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix cancellation history RPC parameters"
          git push origin HEAD:agent/fix-cancellation-history-rpc-params
