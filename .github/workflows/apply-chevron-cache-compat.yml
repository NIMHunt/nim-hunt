name: Apply chevron cache compatibility fix

on:
  push:
    branches:
      - agent/chevron-cache-compat-work

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          ref: agent/chevron-cache-compat-work
          fetch-depth: 0

      - name: Apply cache compatibility changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_str, old, new):
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path_str}: {old!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          old_asset = 'stable-chevron-v1-20260813'
          new_asset = 'chevron-cache-compat-v2-20260813'
          for path in Path('.').rglob('*.py'):
              text = path.read_text(encoding='utf-8')
              if old_asset in text:
                  path.write_text(text.replace(old_asset, new_asset), encoding='utf-8')

          old_spot_ui = 'spot_ui.js?v=special-user-badge-v1-20260727'
          new_spot_ui = 'spot_ui.js?v=chevron-cache-compat-v2-20260813'
          for pattern in ('*.js', '*.py'):
              for path in Path('.').rglob(pattern):
                  text = path.read_text(encoding='utf-8')
                  if old_spot_ui in text:
                      path.write_text(text.replace(old_spot_ui, new_spot_ui), encoding='utf-8')

          css_path = Path('static/home.css')
          css = css_path.read_text(encoding='utf-8')
          old_css = '''/* Stable geometric chevron for collapsible Spot/Claim/FAQ rows. */
          .spot-list-chevron {
              position: relative;
              width: 1.2em !important;
              height: 1.2em !important;
              display: inline-block !important;
              flex: 0 0 1.2em !important;
              transform: rotate(0deg);
              transform-origin: 50% 50%;
              transition: transform 140ms ease;
          }
          '''.replace('          ', '')
          new_css = '''/* Stable geometric chevron for collapsible Spot/Claim/FAQ rows.
             Hide any legacy text glyph that may still be inserted by stale cached JS. */
          .spot-list-chevron {
              position: relative;
              width: 1.2em !important;
              height: 1.2em !important;
              display: inline-block !important;
              flex: 0 0 1.2em !important;
              overflow: hidden;
              text-indent: -9999px;
              transform: rotate(0deg);
              transform-origin: 50% 50%;
              transition: transform 140ms ease;
          }
          '''.replace('          ', '')
          if old_css not in css:
              raise SystemExit('Expected final chevron CSS block not found')
          css_path.write_text(css.replace(old_css, new_css, 1), encoding='utf-8')

          replace_once(
              'static/find_spots_bootstrap.js',
              "import './find_spots.js?v=wrapped-search-v2-20260803';",
              "import './find_spots.js?v=wrapped-search-v2-20260803-chevron-cache-compat-v2-20260813';",
          )
          replace_once(
              'templates/find_spots.html',
              '<script type="module" src="/static/find_spots_bootstrap.js?v=initial-view-v1-20260803"></script>',
              '<script type="module" src="/static/find_spots_bootstrap.js?v=initial-view-v1-20260803-{{ asset_version | default(\'find-spots-v1-20260701\') }}"></script>',
          )
          replace_once(
              'static/my_spots_bootstrap.js',
              "const MY_SPOTS_MODULE_URL = './my_spots.js?v=rapid-deposit-v1-20260805';",
              "const MY_SPOTS_MODULE_URL = './my_spots.js?v=rapid-deposit-v1-20260805-chevron-cache-compat-v2-20260813';",
          )
          replace_once(
              'tests/test_find_spots_initial_view.py',
              'page_import = "./find_spots.js?v=wrapped-search-v2-20260803"',
              'page_import = "./find_spots.js?v=wrapped-search-v2-20260803-chevron-cache-compat-v2-20260813"',
          )
          replace_once(
              'tests/test_find_spots_initial_view.py',
              'assert "/static/find_spots_bootstrap.js?v=initial-view-v1-20260803" in template',
              'assert "/static/find_spots_bootstrap.js?v=initial-view-v1-20260803-{{ asset_version" in template',
          )
          replace_once(
              'tests/test_map_asset_cache_busting.py',
              'MY_SPOTS_PAGE_CACHE_VERSION = "rapid-deposit-v1-20260805"',
              'MY_SPOTS_PAGE_CACHE_VERSION = "rapid-deposit-v1-20260805-chevron-cache-compat-v2-20260813"',
          )
          replace_once(
              'tests/test_map_list_hover_sync.py',
              'assert "text-indent: -9999px;" not in css',
              'assert "text-indent: -9999px;" in css',
          )
          PY

      - name: Validate focused changes
        run: |
          node --check static/find_spots_bootstrap.js
          node --check static/find_spots.js
          node --check static/my_spots_bootstrap.js
          node --check static/my_spots.js
          node --check static/my_claims.js
          python -m pytest \
            tests/test_map_list_hover_sync.py \
            tests/test_marker_hover_outline.py \
            tests/test_find_spots_initial_view.py \
            tests/test_map_asset_cache_busting.py \
            tests/test_spot_requirement_icons.py -q
          ! grep -R "spot_ui.js?v=special-user-badge-v1-20260727" static tests

      - name: Commit fix and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-chevron-cache-compat.yml
          git add public_html.py static/home.css static/find_spots_bootstrap.js static/my_spots_bootstrap.js static/find_spots.js static/my_spots.js static/my_claims.js static/spot_detail.js static/claim_detail.js templates/find_spots.html tests/test_map_list_hover_sync.py tests/test_marker_hover_outline.py tests/test_find_spots_initial_view.py tests/test_map_asset_cache_busting.py tests/test_spot_requirement_icons.py
          git commit -m "Prevent stale chevron cache collisions"
          git push origin HEAD:agent/chevron-cache-compat-work
