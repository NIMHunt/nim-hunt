name: Apply Claim Fixes

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-claim-responsiveness-and-spot-rules
          fetch-depth: 0
      - name: Decode and apply prepared patch
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/claim-fixes.patch
          for part in .github/claim-fix-patch.part*.b64; do
            base64 --decode "$part" >> /tmp/claim-fixes.patch
          done
          git apply --check /tmp/claim-fixes.patch
          git apply /tmp/claim-fixes.patch
          rm -f .github/claim-fix-patch.part*.b64
          rm -f .github/workflows/debug-source-snapshot.yml
          rm -f .github/workflows/apply-claim-fixes.yml
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve claim responsiveness and Spot usability"
          git push origin HEAD:agent/fix-claim-responsiveness-and-spot-rules
