name: Apply content moderation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/content-moderation
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply integration
        run: python .github/apply_content_moderation.py

      - name: Run focused tests
        run: pytest -q tests/test_content_moderation.py

      - name: Run focused checks
        run: |
          ruff check constants.py content_moderation.py public_html.py tests/test_content_moderation.py
          python -m compileall -q constants.py content_moderation.py public_html.py tests/test_content_moderation.py

      - name: Remove temporary integration files
        run: |
          rm .github/apply_content_moderation.py
          rm .github/workflows/apply-content-moderation.yml
          rm .github/workflows/export-moderation-source.yml

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add constants.py content_moderation.py public_html.py tests/test_content_moderation.py .github
          git commit -m "Add basic content moderation"
          git push origin HEAD:agent/content-moderation
