name: Apply detail map zoom limits

on:
  push:
    branches:
      - agent/detail-map-zoom-limits

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/detail-map-zoom-limits
          fetch-depth: 0

      - name: Apply focused detail-map fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'static/spot_detail.js',
              "        dragging: false,\n        touchZoom: true,\n        scrollWheelZoom: true,\n        doubleClickZoom: true,\n        boxZoom: false,",
              "        dragging: false,\n        touchZoom: false,\n        scrollWheelZoom: false,\n        doubleClickZoom: false,\n        boxZoom: false,",
          )

          old_spot_tail = '''    bindSpotMapPopup(radiusCircle, spot);
              bindSpotMapPopup(marker, spot);

              let recentring = false;
              function keepCentred() {
                  if (recentring) return;

                  const current = map.getCenter();
                  const drifted = Math.abs(current.lat - centre[0]) > 0.000001 || Math.abs(current.lng - centre[1]) > 0.000001;
                  if (!drifted) return;

                  recentring = true;
                  map.setView(centre, map.getZoom(), { animate: false });
                  recentring = false;
              }

              map.on('moveend zoomend', keepCentred);
              window.setTimeout(() => {
                  map.invalidateSize(false);
                  keepCentred();
              }, 0);
          }
          '''.replace('          ', '')
          new_spot_tail = '''    bindSpotMapPopup(radiusCircle, spot);
              bindSpotMapPopup(marker, spot);

              const radiusBounds = metreBoundsAround(centre[0], centre[1], spot.radius).pad(0.18);
              function applyRadiusZoomFloor() {
                  map.invalidateSize(false);
                  const minZoom = Math.max(0, Math.min(19, map.getBoundsZoom(radiusBounds, false)));
                  map.setMinZoom(minZoom);
                  if (map.getZoom() < minZoom) {
                      map.setView(centre, minZoom, { animate: false });
                  } else {
                      map.panTo(centre, { animate: false });
                  }
              }

              applyRadiusZoomFloor();
              window.setTimeout(applyRadiusZoomFloor, 0);
          }
          '''.replace('          ', '')
          replace_once('static/spot_detail.js', old_spot_tail, new_spot_tail)

          spot_path = Path('static/spot_detail.js')
          spot_text = spot_path.read_text(encoding='utf-8')
          if 'function metreBoundsAround(' not in spot_text:
              marker = 'function buildSpotMapShell() {'
              helper = '''function metreBoundsAround(lat, long, radiusMetres) {
                  const radius = Math.max(1, Number(radiusMetres || 25));
                  const latNum = Number(lat);
                  const longNum = Number(long);
                  const metresPerDegreeLat = 111320;
                  const cosLat = Math.max(0.01, Math.abs(Math.cos(latNum * Math.PI / 180)));
                  const latDelta = radius / metresPerDegreeLat;
                  const longDelta = radius / (metresPerDegreeLat * cosLat);

                  return window.L.latLngBounds(
                      [latNum - latDelta, longNum - longDelta],
                      [latNum + latDelta, longNum + longDelta]
                  );
              }

              '''.replace('              ', '')
              if marker not in spot_text:
                  raise SystemExit('Spot map shell insertion point missing')
              spot_path.write_text(spot_text.replace(marker, helper + marker, 1), encoding='utf-8')

          old_claim_fit = '''    const paddedBounds = bounds.pad(0.18);
              map.invalidateSize(false);
              map.fitBounds(paddedBounds, { animate: false, maxZoom: 16 });
              window.setTimeout(() => {
                  map.invalidateSize(false);
                  map.fitBounds(paddedBounds, { animate: false, maxZoom: 16 });
              }, 0);
          }
          '''.replace('          ', '')
          new_claim_fit = '''    const radiusBounds = metreBoundsAround(centre[0], centre[1], spot.radius).pad(0.18);
              const paddedBounds = bounds.pad(0.18);
              function fitLockedClaimMap() {
                  map.invalidateSize(false);
                  const minZoom = Math.max(0, Math.min(19, map.getBoundsZoom(radiusBounds, false)));
                  map.setMinZoom(minZoom);
                  map.fitBounds(paddedBounds, { animate: false, maxZoom: 16 });
                  if (map.getZoom() < minZoom) {
                      map.setView(centre, minZoom, { animate: false });
                  }
              }

              fitLockedClaimMap();
              window.setTimeout(fitLockedClaimMap, 0);
          }
          '''.replace('          ', '')
          replace_once('static/claim_detail.js', old_claim_fit, new_claim_fit)

          replace_once(
              'templates/spot.html',
              '/static/spot_detail.js?v=claim-live-v1-20260719-',
              '/static/spot_detail.js?v=locked-radius-zoom-v1-20260814-',
          )
          replace_once(
              'templates/claim.html',
              '/static/claim_detail.js?v=claim-confetti-v2-20260720-',
              '/static/claim_detail.js?v=locked-radius-zoom-v1-20260814-',
          )

          test = '''from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]


          def source(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")


          def test_spot_detail_map_only_allows_explicit_zoom_controls():
              page = source("static/spot_detail.js")
              assert "zoomControl: true" in page
              assert "dragging: false" in page
              assert "touchZoom: false" in page
              assert "scrollWheelZoom: false" in page
              assert "doubleClickZoom: false" in page
              assert "boxZoom: false" in page
              assert "keyboard: false" in page
              assert "map.on('moveend zoomend', keepCentred);" not in page


          def test_spot_detail_zoom_floor_is_derived_from_spot_radius():
              page = source("static/spot_detail.js")
              assert "const radiusBounds = metreBoundsAround(centre[0], centre[1], spot.radius).pad(0.18);" in page
              assert "map.getBoundsZoom(radiusBounds, false)" in page
              assert "map.setMinZoom(minZoom);" in page


          def test_claim_detail_keeps_gestures_locked_and_limits_zoom_out_by_radius():
              page = source("static/claim_detail.js")
              assert "zoomControl: true" in page
              assert "dragging: false" in page
              assert "touchZoom: false" in page
              assert "scrollWheelZoom: false" in page
              assert "doubleClickZoom: false" in page
              assert "const radiusBounds = metreBoundsAround(centre[0], centre[1], spot.radius).pad(0.18);" in page
              assert "map.getBoundsZoom(radiusBounds, false)" in page
              assert "map.setMinZoom(minZoom);" in page


          def test_detail_map_cache_keys_are_bumped():
              spot = source("templates/spot.html")
              claim = source("templates/claim.html")
              assert "/static/spot_detail.js?v=locked-radius-zoom-v1-20260814-" in spot
              assert "/static/claim_detail.js?v=locked-radius-zoom-v1-20260814-" in claim
          '''.replace('          ', '')
          Path('tests/test_detail_map_zoom_controls.py').write_text(test, encoding='utf-8')
          PY

      - name: Validate focused behaviour
        run: |
          node --check static/spot_detail.js
          node --check static/claim_detail.js
          python -m pip install pytest >/dev/null
          python -m pytest -q tests/test_detail_map_zoom_controls.py

      - name: Commit fix and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-detail-map-zoom-limits.yml
          git add static/spot_detail.js static/claim_detail.js templates/spot.html templates/claim.html tests/test_detail_map_zoom_controls.py
          git commit -m "Lock detail maps and bound zoom by Spot radius"
          git push origin HEAD:agent/detail-map-zoom-limits
