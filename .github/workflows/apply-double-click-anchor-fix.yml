name: Apply double-click anchor fix

on:
  push:
    branches:
      - agent/prevent-find-spots-double-click-recenter

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/prevent-find-spots-double-click-recenter
          fetch-depth: 0

      - name: Apply focused fix
        run: |
          python - <<'PY'
          from pathlib import Path

          page_path = Path('static/find_spots.js')
          page = page_path.read_text(encoding='utf-8')

          old = "    state.map.boxZoom?.[method]?.();\n}"
          new = "    state.map.boxZoom?.[method]?.();\n    state.map.doubleClickZoom?.[method]?.();\n}"
          if old not in page:
              raise SystemExit('interaction lock insertion point not found')
          page = page.replace(old, new, 1)

          old = "        boxZoom: !state.hasUserLocation,\n    }).setView"
          new = "        boxZoom: !state.hasUserLocation,\n        doubleClickZoom: !state.hasUserLocation,\n    }).setView"
          if old not in page:
              raise SystemExit('map option insertion point not found')
          page = page.replace(old, new, 1)
          page_path.write_text(page, encoding='utf-8')

          bootstrap_path = Path('static/find_spots_bootstrap.js')
          bootstrap = bootstrap_path.read_text(encoding='utf-8')
          old_version = './find_spots.js?v=wide-map-refresh-v1-20260813'
          new_version = './find_spots.js?v=anchored-map-v2-20260814'
          if old_version not in bootstrap:
              raise SystemExit('page module cache key not found')
          bootstrap_path.write_text(bootstrap.replace(old_version, new_version, 1), encoding='utf-8')

          template_path = Path('templates/find_spots.html')
          template = template_path.read_text(encoding='utf-8')
          old_version = '/static/find_spots_bootstrap.js?v=wide-map-refresh-v1-20260813-{{ asset_version'
          new_version = '/static/find_spots_bootstrap.js?v=anchored-map-v2-20260814-{{ asset_version'
          if old_version not in template:
              raise SystemExit('bootstrap cache key not found')
          template_path.write_text(template.replace(old_version, new_version, 1), encoding='utf-8')

          for test_path in (
              Path('tests/test_find_spots_initial_view.py'),
              Path('tests/test_find_spots_search_transport.py'),
          ):
              text = test_path.read_text(encoding='utf-8')
              text = text.replace('wide-map-refresh-v1-20260813', 'anchored-map-v2-20260814')
              test_path.write_text(text, encoding='utf-8')

          resilience_path = Path('tests/test_find_spots_refresh_resilience.py')
          resilience = resilience_path.read_text(encoding='utf-8')
          addition = '''\n\ndef test_known_location_disables_double_click_recentering():\n    page = source("static/find_spots.js")\n\n    interaction = page.split("function setMapInteractionEnabled(enabled) {", 1)[1].split(\n        "function clearScheduledMapRefresh()", 1\n    )[0]\n    setup = page.split("function setupMap() {", 1)[1].split(\n        "async function initFindSpots()", 1\n    )[0]\n\n    assert "state.map.doubleClickZoom?.[method]?.();" in interaction\n    assert "doubleClickZoom: !state.hasUserLocation," in setup\n'''
          if 'test_known_location_disables_double_click_recentering' not in resilience:
              resilience += addition
          resilience_path.write_text(resilience, encoding='utf-8')
          PY

      - name: Validate focused behaviour
        run: |
          node --check static/find_spots.js
          python -m pip install pytest >/dev/null
          python -m pytest -q \
            tests/test_find_spots_refresh_resilience.py \
            tests/test_find_spots_initial_view.py \
            tests/test_find_spots_search_transport.py

      - name: Commit fix and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-double-click-anchor-fix.yml
          git add static/find_spots.js static/find_spots_bootstrap.js templates/find_spots.html tests/test_find_spots_refresh_resilience.py tests/test_find_spots_initial_view.py tests/test_find_spots_search_transport.py
          git commit -m "Prevent located Find Spots double-click recentering"
          git push origin HEAD:agent/prevent-find-spots-double-click-recenter
