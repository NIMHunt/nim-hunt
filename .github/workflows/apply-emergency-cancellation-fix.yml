name: Apply emergency cancellation fix

on:
  push:
    branches:
      - agent/stop-repeated-cancellation-refunds
  pull_request:
    branches:
      - agent/emergency-cancellation-repair-base

permissions:
  contents: write

concurrency:
  group: emergency-cancellation-fix
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NIMHUNT_DB_PATH: ${{ runner.temp }}/nimhunt-emergency.db
      NIMHUNT_DEPLOYMENT_MODE: development
      NIMHUNT_NIMIQ_NETWORK: TestAlbatross
      NIMHUNT_NIMIQ_ALLOW_DEFAULT_TEST_MNEMONIC: "1"
      NIMHUNT_SPOT_CANCELLATION_FEE_ADDRESS: NQ71 3SFL BTU7 A3FV T0EM 9H60 KN6E 0UE3 VHYN
      NIMHUNT_MIN_SPOT_CREATION_FEE_NIM: "10"

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: agent/stop-repeated-cancellation-refunds
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: helpers/package-lock.json

      - name: Apply code changes
        run: |
          python tools/patch_cancellation_backend.py
          python tools/patch_cancellation_ui.py
          python tools/patch_cancellation_tests.py
          rm -f \
            tools/patch_cancellation_backend.py \
            tools/patch_cancellation_ui.py \
            tools/patch_cancellation_tests.py \
            tools/emergency-repair-trigger.txt \
            .github/workflows/apply-emergency-cancellation-fix.yml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm ci --prefix helpers

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run Node tests
        run: npm test --prefix helpers

      - name: Run lint and compilation checks
        run: |
          ruff check .
          python -m compileall -q *.py tests
          for file in static/*.js; do node --check --input-type=module < "$file"; done
          for file in helpers/*.mjs; do node --check "$file"; done
          for file in *.sh; do bash -n "$file"; done

      - name: Compile Jinja templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader

          templates = Path("templates")
          environment = Environment(loader=FileSystemLoader(templates))
          for path in sorted(templates.glob("*.html")):
              environment.get_template(path.name)
          PY

      - name: Seed fresh development database
        run: |
          rm -f "$NIMHUNT_DB_PATH"
          python spoof.py
          rm -f "$NIMHUNT_DB_PATH"

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stop repeated cancellation payouts"
          git push origin HEAD:agent/stop-repeated-cancellation-refunds
