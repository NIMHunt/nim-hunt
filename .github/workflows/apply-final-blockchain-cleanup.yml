name: Apply final blockchain cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: agent/restore-blockchain-flows
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: helpers/package-lock.json

      - name: Apply cleanup
        run: python tools/apply_final_blockchain_cleanup.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm ci --prefix helpers

      - name: Run full validation
        id: validation
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python -m pytest -q
            npm test --prefix helpers
            ruff check .
            python -m compileall -q *.py tests
            for file in static/*.js; do node --check --input-type=module < "$file"; done
            for file in helpers/*.mjs; do node --check "$file"; done
            python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader
          environment = Environment(loader=FileSystemLoader(Path('templates')))
          for path in sorted(Path('templates').glob('*.html')):
              environment.get_template(path.name)
          PY
          } 2>&1 | tee final-cleanup-validation.log

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-cleanup-validation
          path: final-cleanup-validation.log

      - name: Remove temporary cleanup machinery
        if: steps.validation.outcome == 'success'
        run: |
          rm -f tools/apply_final_blockchain_cleanup.py
          rm -f .github/workflows/apply-final-blockchain-cleanup.yml
          rm -f final-cleanup-validation.log

      - name: Commit cleanup
        if: steps.validation.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish blockchain flow hardening"
          git push origin HEAD:agent/restore-blockchain-flows

      - name: Report validation failure
        if: steps.validation.outcome == 'failure'
        run: exit 1
