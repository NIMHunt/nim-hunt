name: Apply Follow-up Fixes

on:
  push:
    branches:
      - agent/fix-cancellation-and-spot-list

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Decode and apply prepared patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/followup-fixes.part*.b64 | base64 --decode | gzip --decompress > /tmp/followup.patch
          git apply --check /tmp/followup.patch
          git apply /tmp/followup.patch
          rm -f .github/followup-fixes.part*.b64
          rm -f .github/workflows/apply-followup-fixes.yml
          rm -f .github/workflows/debug-followup-snapshot.yml
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve Spot cancellation, deposits and Find Spots"
          git push origin HEAD:agent/fix-cancellation-and-spot-list
