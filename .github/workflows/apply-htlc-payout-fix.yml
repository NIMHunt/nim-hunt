name: Apply HTLC payout fix

on:
  push:
    branches:
      - agent/fix-htlc-cancellation-refunds
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-htlc-cancellation-refunds
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: helpers/package-lock.json

      - name: Apply repair
        run: python .github/scripts/apply_htlc_payout_fix.py

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests

      - name: Install helper dependencies
        working-directory: helpers
        run: npm ci

      - name: Run Node tests
        working-directory: helpers
        run: npm test

      - name: Remove temporary patch machinery
        run: rm -f .github/scripts/apply_htlc_payout_fix.py .github/workflows/apply-htlc-payout-fix.yml .github/htlc-fix-trigger.txt

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resolve Nimiq Pay HTLC payout addresses"
          git push origin HEAD:agent/fix-htlc-cancellation-refunds
