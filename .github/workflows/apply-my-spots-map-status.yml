name: Apply My Spots map status patch

on:
  push:
    branches:
      - agent/my-spots-map-end-time-status

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply prepared patch
        run: |
          git apply --check nimhunt-my-spots-map-status.patch
          git apply nimhunt-my-spots-map-status.patch
          rm nimhunt-my-spots-map-status.patch
          rm .github/workflows/apply-my-spots-map-status.yml

      - name: Commit applied changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine My Spots map visibility"
          git push
