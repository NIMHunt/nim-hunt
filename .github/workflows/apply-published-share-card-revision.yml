name: Apply published share and card revision

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-published-share-card-revision
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/published-share-and-card-revisions

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply update
        run: python .github/apply_published_share_card_revision.py

      - name: Run focused verification
        run: |
          pytest -q tests/test_social_preview.py tests/test_x_share.py tests/test_x_auto_poster.py
          ruff check social_card_images.py social_preview.py x_auto_poster.py tests/test_social_preview.py tests/test_x_share.py
          python -m compileall -q social_card_images.py social_preview.py x_auto_poster.py
          node --check static/x_share.js

      - name: Remove temporary integration files
        run: |
          rm .github/apply_published_share_card_revision.py
          rm .github/workflows/apply-published-share-card-revision.yml

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Limit X sharing and revision Spot cards"
          git push origin HEAD:agent/published-share-and-card-revisions
