name: Apply rapid deposit fix

on:
  push:
    branches:
      - agent/fix-rapid-deposit-validity-and-recovery

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/fix-rapid-deposit-validity-and-recovery
          fetch-depth: 0

      - name: Decode and apply patch
        run: |
          base64 --decode .github/rapid-deposit-fix.patch.gz.b64 | gzip --decompress > /tmp/rapid-deposit-fix.patch
          git apply --check /tmp/rapid-deposit-fix.patch
          git apply /tmp/rapid-deposit-fix.patch
          git diff --check

      - name: Run focused JavaScript tests
        run: |
          node --test helpers/nimiq_payment.test.mjs helpers/pending_deposit_store.test.mjs
          node --check static/nimiq_payment.js
          node --check static/pending_deposit_store.js
          node --check static/my_spots.js

      - name: Commit implementation and remove staging files
        run: |
          rm .github/rapid-deposit-fix.patch.gz.b64
          rm .github/workflows/apply-rapid-deposit-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix rapid deposit validity and recovery"
          git push origin HEAD:agent/fix-rapid-deposit-validity-and-recovery
