name: Apply repository polish on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/judge-facing-repository-polish'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply documentation-only patch
        run: python .github/apply_repository_polish.py

      - name: Verify final patch
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          assert "https://nimhunt.app" in readme
          assert "static/images/nimhunt-default-social-card.png" in readme
          assert "schema version `3`" in readme
          assert "schema to version `2`" not in readme
          assert "has three layers" in Path("cache.py").read_text(encoding="utf-8")
          assert Path("CONTRIBUTING.md").is_file()
          assert Path("SECURITY.md").is_file()
          assert Path(".github/pull_request_template.md").is_file()
          assert not Path(".github/apply_repository_polish.py").exists()
          assert not Path(".github/workflows/apply-repository-polish.yml").exists()
          assert not Path(".github/workflows/apply-repository-polish-pr.yml").exists()
          PY

      - name: Commit polished repository files
        run: |
          git config user.name "NimHunt"
          git config user.email "300551717+NIMHunt@users.noreply.github.com"
          git add -A
          git commit -m "Polish repository presentation and guidance"
          git push origin HEAD:agent/judge-facing-repository-polish
