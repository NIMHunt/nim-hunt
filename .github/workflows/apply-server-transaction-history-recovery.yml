name: Apply server transaction history recovery

on:
  push:
    branches:
      - agent/recover-confirmed-cancellation-transactions

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: agent/recover-confirmed-cancellation-transactions
          fetch-depth: 0

      - name: Apply focused repair
        run: |
          python tools/apply_server_transaction_history_recovery.py
          rm -f tools/apply_server_transaction_history_recovery.py
          rm -f tools/server_transaction_history_recovery_trigger.txt
          rm -f .github/workflows/apply-server-transaction-history-recovery.yml

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: helpers/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm ci --prefix helpers

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run Node tests
        run: npm test --prefix helpers

      - name: Run Python lint and compilation checks
        run: |
          ruff check .
          python -m compileall -q *.py tests

      - name: Run JavaScript and shell syntax checks
        run: |
          for file in static/*.js; do node --check --input-type=module < "$file"; done
          for file in helpers/*.mjs; do node --check "$file"; done
          for file in *.sh; do bash -n "$file"; done

      - name: Compile Jinja templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader

          templates = Path("templates")
          environment = Environment(loader=FileSystemLoader(templates))
          for path in sorted(templates.glob("*.html")):
              environment.get_template(path.name)
          PY

      - name: Seed a fresh development database
        env:
          NIMHUNT_DB_PATH: ${{ runner.temp }}/nimhunt-ci.db
          NIMHUNT_DEPLOYMENT_MODE: development
          NIMHUNT_NIMIQ_NETWORK: TestAlbatross
          NIMHUNT_NIMIQ_ALLOW_DEFAULT_TEST_MNEMONIC: "1"
        run: python spoof.py

      - name: Check and audit dependencies
        run: |
          python -m pip check
          python -m pip_audit --progress-spinner off
          npm audit --omit=dev --prefix helpers

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover confirmed cancellation transactions"
          git push origin HEAD:agent/recover-confirmed-cancellation-transactions
