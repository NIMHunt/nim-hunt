name: Apply social preview patch

on:
  push:
    branches:
      - agent/social-preview-cards

permissions:
  contents: write

concurrency:
  group: apply-social-preview
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/social-preview-cards

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Apply social preview implementation
        run: |
          set +e
          python scripts/apply_social_preview_patch.py > /tmp/social-preview-patch.log 2>&1
          patch_status=$?
          set -e
          if [ "$patch_status" -ne 0 ]; then
            cp /tmp/social-preview-patch.log social-preview-patch-error.txt
          fi

      - name: Commit implementation or diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply social preview implementation"
          git push origin HEAD:agent/social-preview-cards
