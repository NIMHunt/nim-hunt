name: Apply special user alignment

on:
  push:
    branches:
      - agent/align-special-user-badge

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/align-special-user-badge
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Apply alignment fix
        run: python .github/apply_special_user_alignment.py
      - name: Run focused regression tests
        run: python -m pytest -q tests/test_special_users.py
      - name: Commit alignment fix
        run: |
          if git diff --quiet; then
            echo "Alignment fix already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/home.css tests/test_special_users.py
          git commit -m "Align special user badge with text baseline"
          git push origin HEAD:agent/align-special-user-badge
