name: Apply live special user ID fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-live-special-user-id
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: helpers/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm ci --prefix helpers
      - name: Apply ID correction
        run: python .github/apply_special_user_id_fix.py
      - name: Run focused tests
        run: python -m pytest -q tests/test_special_users.py
      - name: Run full Python tests
        run: python -m pytest -q
      - name: Run Node tests
        run: npm test --prefix helpers
      - name: Run lint and syntax checks
        run: |
          ruff check .
          python -m compileall -q *.py tests
          for file in static/*.js; do node --check --input-type=module < "$file"; done
      - name: Commit correction
        run: |
          git config user.name 'NimHunt'
          git config user.email '300551717+NIMHunt@users.noreply.github.com'
          git add constants.py tests/test_special_users.py
          git commit -m 'Correct live special user ID'
          git push origin HEAD:agent/fix-live-special-user-id
