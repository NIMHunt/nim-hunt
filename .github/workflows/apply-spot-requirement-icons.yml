name: Apply Spot requirement icons

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-spot-requirement-icons
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/spot-requirement-icons

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Apply changes
        run: python scripts/apply_spot_requirement_icons.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add duration requirement icons"
          git push origin HEAD:agent/spot-requirement-icons
