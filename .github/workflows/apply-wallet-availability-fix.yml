name: Apply wallet and availability fixes

on: push

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restrict-funding-wallet-and-spot-availability
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply, test, and publish
        shell: bash
        run: |
          set +e
          log=/tmp/wallet-availability.log
          : > "$log"

          python -m pip install --upgrade pip >> "$log" 2>&1
          python -m pip install -r requirements.txt >> "$log" 2>&1
          install_status=$?

          if [ "$install_status" -eq 0 ]; then
            python .nimhunt_patch_wallet_availability.py >> "$log" 2>&1
            patch_status=$?
          else
            patch_status=99
          fi

          if [ "$patch_status" -eq 0 ]; then
            python -m py_compile database.py db_access.py trans_updater.py public_html.py tests/test_funding_wallet_and_find_spots.py >> "$log" 2>&1
            compile_status=$?
            node --check static/find_spots.js >> "$log" 2>&1
            node_status=$?
            bash -n nimhunt_start_dev.sh >> "$log" 2>&1
            shell_one=$?
            bash -n nimhunt_reset_mock_data.sh >> "$log" 2>&1
            shell_two=$?
            git diff --check >> "$log" 2>&1
            diff_status=$?
          else
            compile_status=99
            node_status=99
            shell_one=99
            shell_two=99
            diff_status=99
          fi

          if [ "$compile_status" -eq 0 ] && [ "$node_status" -eq 0 ] && [ "$shell_one" -eq 0 ] && [ "$shell_two" -eq 0 ] && [ "$diff_status" -eq 0 ]; then
            python -m unittest discover -s tests -v >> "$log" 2>&1
            test_status=$?
          else
            test_status=99
          fi

          git config user.name "NimHunt Review Bot"
          git config user.email "actions@users.noreply.github.com"

          if [ "$install_status" -eq 0 ] && [ "$patch_status" -eq 0 ] && [ "$compile_status" -eq 0 ] && [ "$node_status" -eq 0 ] && [ "$shell_one" -eq 0 ] && [ "$shell_two" -eq 0 ] && [ "$diff_status" -eq 0 ] && [ "$test_status" -eq 0 ]; then
            rm -f .github/workflows/apply-wallet-availability-fix.yml
            rm -f .nimhunt_patch_wallet_availability.py .wallet-availability-trigger .wallet-availability-trigger-2 .wallet-availability-report.txt
            git add -A
            git commit -m "Restrict Spot funding wallets and refine availability"
          else
            git reset --hard HEAD
            {
              echo "install_status=$install_status"
              echo "patch_status=$patch_status"
              echo "compile_status=$compile_status"
              echo "node_status=$node_status"
              echo "shell_one=$shell_one"
              echo "shell_two=$shell_two"
              echo "diff_status=$diff_status"
              echo "test_status=$test_status"
              echo
              cat "$log"
            } > .wallet-availability-report.txt
            git add .wallet-availability-report.txt
            git commit -m "Record wallet availability test failure"
          fi

          git push origin HEAD:agent/restrict-funding-wallet-and-spot-availability
