name: Apply wallet and availability fixes

on: push

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restrict-funding-wallet-and-spot-availability
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply reviewed patch
        run: python .nimhunt_patch_wallet_availability.py

      - name: Check syntax and formatting
        run: |
          python -m py_compile database.py db_access.py trans_updater.py public_html.py tests/test_funding_wallet_and_find_spots.py
          node --check static/find_spots.js
          bash -n nimhunt_start_dev.sh
          bash -n nimhunt_reset_mock_data.sh
          git diff --check

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Commit verified changes
        shell: bash
        run: |
          rm -f .github/workflows/apply-wallet-availability-fix.yml
          rm -f .nimhunt_patch_wallet_availability.py .wallet-availability-trigger .wallet-availability-trigger-2
          git config user.name "NimHunt Review Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Restrict Spot funding wallets and refine availability"
          git push origin HEAD:agent/restrict-funding-wallet-and-spot-availability
