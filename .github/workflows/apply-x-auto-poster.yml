name: Apply automatic X poster integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-automatic-x-poster
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/automatic-x-posts

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Apply integration
        run: python scripts/apply_x_auto_poster_integration.py

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate automatic X posting"
          git push origin HEAD:agent/automatic-x-posts
