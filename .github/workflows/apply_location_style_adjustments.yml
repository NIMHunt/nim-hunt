name: Apply location style adjustments

on:
  push:
    branches:
      - agent/resilient-mobile-location

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out patch branch
        uses: actions/checkout@v6
        with:
          ref: agent/resilient-mobile-location

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: helpers/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm ci --prefix helpers

      - name: Apply requested style adjustments
        run: python .github/apply_location_style_adjustments.py

      - name: Run focused location tests
        run: python -m pytest -q tests/test_location_resilience.py

      - name: Run full Python tests
        run: python -m pytest -q

      - name: Run Node tests
        run: npm test --prefix helpers

      - name: Run syntax and lint checks
        run: |
          ruff check tests/test_location_resilience.py
          python -m compileall -q *.py tests
          for file in static/*.js; do node --check --input-type=module < "$file"; done

      - name: Commit adjustments
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/find_spots.js static/interface_text.js static/home.css templates/find_spots.html tests/test_location_resilience.py
          git commit -m "Align location control styling"
          git push
