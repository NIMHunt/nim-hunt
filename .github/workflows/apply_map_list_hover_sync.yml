name: Apply map-list hover sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/map-list-hover-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Apply focused changes
        run: python .github/scripts/apply_map_list_hover_sync.py

      - name: Remove temporary machinery
        run: rm .github/scripts/apply_map_list_hover_sync.py .github/workflows/apply_map_list_hover_sync.yml .github/MAP_LIST_HOVER_SYNC_WIP.md .github/OPEN_PR_TRIGGER.md

      - name: Commit final result
        run: |
          git config user.name 'NIMHunt'
          git config user.email 'noreply@github.com'
          git add -A
          git commit -m 'Synchronize map and list hover states'
          git push origin HEAD:${{ github.head_ref }}
