name: Apply map and list interactions

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/map-list-interactions'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/map-list-interactions
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Apply focused changes
        run: |
          python tools/apply_map_list_interactions.py
          sed -i '/^import re$/d' tests/test_find_spots_map_interactions.py
          sed -i "s/\` ,$/\`,/" static/interface_text.js

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm ci --prefix helpers

      - name: Verify complete project
        id: verification
        continue-on-error: true
        run: |
          {
            python -m pytest -q
            npm test --prefix helpers
            ruff check .
            python -m compileall -q *.py tests
            for file in static/*.js; do node --check --input-type=module < "$file"; done
            for file in helpers/*.mjs; do node --check "$file"; done
            for file in *.sh; do bash -n "$file"; done
            python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader

          templates = Path('templates')
          environment = Environment(loader=FileSystemLoader(templates))
          for path in sorted(templates.glob('*.html')):
              environment.get_template(path.name)
          PY
            NIMHUNT_DB_PATH="${RUNNER_TEMP}/nimhunt-ci.db" \
            NIMHUNT_DEPLOYMENT_MODE=development \
            NIMHUNT_NIMIQ_NETWORK=TestAlbatross \
            NIMHUNT_NIMIQ_ALLOW_DEFAULT_TEST_MNEMONIC=1 \
            python spoof.py
            python -m pip check
            git diff --check
          } > verification-output.txt 2>&1

      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-list-verification-output
          path: verification-output.txt

      - name: Stop on validation failure
        if: steps.verification.outcome == 'failure'
        run: exit 1

      - name: Remove temporary machinery
        run: |
          rm .github/workflows/apply_map_list_interactions.yml
          rm tools/apply_map_list_interactions.py
          rm -f verification-output.txt

      - name: Commit final result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve Find Spots map interactions"
          git push origin HEAD:agent/map-list-interactions
