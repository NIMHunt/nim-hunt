name: Apply single-open details and copy

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/single-open-details-and-copy'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/single-open-details-and-copy
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Apply focused changes
        run: python tools/apply_single_open_details.py

      - name: Remove temporary machinery
        run: |
          rm .github/workflows/apply_single_open_details.yml
          rm tools/apply_single_open_details.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm ci --prefix helpers

      - name: Verify complete project
        run: |
          python -m pytest -q
          npm test --prefix helpers
          ruff check .
          python -m compileall -q *.py tests
          for file in static/*.js; do node --check --input-type=module < "$file"; done
          for file in helpers/*.mjs; do node --check "$file"; done
          for file in *.sh; do bash -n "$file"; done
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader

          templates = Path('templates')
          environment = Environment(loader=FileSystemLoader(templates))
          for path in sorted(templates.glob('*.html')):
              environment.get_template(path.name)
          PY
          NIMHUNT_DB_PATH="${RUNNER_TEMP}/nimhunt-ci.db" \
          NIMHUNT_DEPLOYMENT_MODE=development \
          NIMHUNT_NIMIQ_NETWORK=TestAlbatross \
          NIMHUNT_NIMIQ_ALLOW_DEFAULT_TEST_MNEMONIC=1 \
          python spoof.py
          python -m pip check
          git diff --check

      - name: Commit final result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make detail lists single-open and clarify Spot rewards"
          git push origin HEAD:agent/single-open-details-and-copy
