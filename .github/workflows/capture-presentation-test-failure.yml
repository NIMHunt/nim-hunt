name: Capture presentation test failure

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  capture:
    if: github.head_ref == 'agent/presentation-spots-long-titles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/presentation-spots-long-titles
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Capture concise Python failure
        run: |
          if [ -f .github/presentation-test-failure.txt ]; then
            exit 0
          fi
          pip install -r requirements.txt >/dev/null
          python -m unittest discover -v > /tmp/python-tests.txt 2>&1 || true
          tail -n 180 /tmp/python-tests.txt > .github/presentation-test-failure.txt

      - name: Commit diagnostic
        run: |
          if git diff --quiet -- .github/presentation-test-failure.txt; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/presentation-test-failure.txt
          git commit -m "Capture presentation test failure"
          git push origin HEAD:agent/presentation-spots-long-titles
