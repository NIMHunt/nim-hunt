name: Finalize presentation test expectation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/presentation-spots-long-titles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/presentation-spots-long-titles
          fetch-depth: 0

      - name: Update dynamic mock count expectation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_spot_creation_fees.py')
          source = path.read_text(encoding='utf-8')
          old = 'self.assertEqual(summary["published_spot_count"], 8)'
          new = (
              'self.assertEqual(\n'
              '                    summary["published_spot_count"],\n'
              '                    len(spoof.PRESENTATION_SPOTS),\n'
              '                )'
          )
          if source.count(old) != 1:
              raise RuntimeError('Expected exactly one old mock Spot count assertion')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY

      - name: Remove temporary diagnostics
        run: |
          rm -f .github/presentation-test-failure.txt
          rm -f .github/workflows/capture-presentation-test-failure.yml

      - name: Commit final result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update presentation mock count test"
          git push origin HEAD:agent/presentation-spots-long-titles
