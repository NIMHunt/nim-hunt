name: Capture PR86 pytest output

on:
  push:
    branches:
      - agent/resilient-mobile-location
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out patch branch
        uses: actions/checkout@v6
        with:
          ref: agent/resilient-mobile-location

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Capture pytest output
        shell: bash
        run: |
          set +e
          python -m pytest -q > pytest-full.log 2>&1
          status=$?
          cat pytest-full.log
          echo "$status" > pytest-status.txt
          exit 0

      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr86-pytest-output
          path: |
            pytest-full.log
            pytest-status.txt
