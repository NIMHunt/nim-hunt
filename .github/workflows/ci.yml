name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: helpers/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm ci --prefix helpers

      - name: Run Python tests
        run: |
          cat > conftest.py <<'PY'
          import json

          def pytest_exception_interact(node, call, report):
              for entry in call.excinfo.traceback:
                  settled = entry.frame.f_locals.get("settled")
                  if settled is not None:
                      print("\nFULL_SETTLED_RESULT")
                      print(json.dumps(settled, default=str, indent=2, sort_keys=True))
          PY
          set -o pipefail
          python -m pytest -q --showlocals -s 2>&1 | tee pytest.log

      - name: Upload Python test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log

      - name: Run Node tests
        run: npm test --prefix helpers

      - name: Run Python lint and compilation checks
        run: |
          ruff check .
          python -m compileall -q *.py tests

      - name: Run JavaScript and shell syntax checks
        run: |
          for file in static/*.js; do node --check --input-type=module < "$file"; done
          for file in helpers/*.mjs; do node --check "$file"; done
          for file in *.sh; do bash -n "$file"; done

      - name: Compile Jinja templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader

          templates = Path("templates")
          environment = Environment(loader=FileSystemLoader(templates))
          for path in sorted(templates.glob("*.html")):
              environment.get_template(path.name)
          PY

      - name: Seed a fresh development database
        env:
          NIMHUNT_DB_PATH: ${{ runner.temp }}/nimhunt-ci.db
          NIMHUNT_DEPLOYMENT_MODE: development
          NIMHUNT_NIMIQ_NETWORK: TestAlbatross
          NIMHUNT_NIMIQ_ALLOW_DEFAULT_TEST_MNEMONIC: "1"
        run: python spoof.py

      - name: Check installed dependencies
        run: python -m pip check

      - name: Audit dependencies
        run: |
          python -m pip_audit --progress-spinner off
          npm audit --omit=dev --prefix helpers
