name: Diagnose cancellation refunds

on:
  push:
    branches:
      - agent/diagnose-cancellation-refunds
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4

      - name: Inspect public TestAlbatross transaction history
        id: inspect
        shell: bash
        run: |
          set +e
          python .github/scripts/diagnose_cancellation_refunds.py > cancellation-diagnostic.log 2>&1
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cancellation-diagnostic
          path: cancellation-diagnostic.log
          if-no-files-found: error
          retention-days: 1

      - name: Preserve diagnostic failure status
        if: always() && steps.inspect.outputs.exit_code != '0'
        run: exit 1
