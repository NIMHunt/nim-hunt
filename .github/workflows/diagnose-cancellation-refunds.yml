name: Diagnose cancellation refunds

on:
  push:
    branches:
      - agent/diagnose-cancellation-refunds
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public TestAlbatross transaction history
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request

          RPC_URL = "https://rpc.testnet.nimiqwatch.com/"
          FEE_ADDRESS = "NQ38 2YYK 977P FX4B 2D89 LLL7 YYNQ NPL5 VP1T"

          def rpc(method, params):
              request = urllib.request.Request(
                  RPC_URL,
                  data=json.dumps({"jsonrpc": "2.0", "id": 1, "method": method, "params": params}).encode(),
                  headers={"content-type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              if payload.get("error"):
                  raise RuntimeError(f"{method} failed: {payload['error']}")
              result = payload.get("result")
              if isinstance(result, dict) and "data" in result:
                  return result["data"]
              return result

          def address_key(value):
              return "".join(str(value or "").upper().split())

          def first(tx, *keys):
              for key in keys:
                  if key in tx and tx[key] is not None:
                      return tx[key]
              return None

          def transactions(value):
              queue = [value]
              found = []
              while queue:
                  item = queue.pop(0)
                  if isinstance(item, list):
                      queue.extend(item)
                  elif isinstance(item, dict):
                      if any(key in item for key in ("hash", "transactionHash", "txHash")):
                          found.append(item)
                      else:
                          for key in ("transactions", "items", "data", "results", "result"):
                              child = item.get(key)
                              if isinstance(child, (list, dict)):
                                  queue.append(child)
              return found

          def summary(tx):
              return {
                  "hash": first(tx, "hash", "transactionHash", "txHash"),
                  "sender": first(tx, "sender", "senderAddress", "from", "fromAddress"),
                  "recipient": first(tx, "recipient", "recipientAddress", "to", "toAddress"),
                  "value": first(tx, "value", "amount"),
                  "fee": first(tx, "fee"),
                  "executionResult": first(tx, "executionResult"),
                  "blockNumber": first(tx, "blockNumber", "blockHeight", "block"),
                  "timestamp": first(tx, "timestamp", "time"),
                  "data": first(tx, "data"),
              }

          fee_history = transactions(rpc("getTransactionsByAddress", [FEE_ADDRESS, 500]))
          incoming_fees = [
              tx for tx in fee_history
              if address_key(first(tx, "recipient", "recipientAddress", "to", "toAddress")) == address_key(FEE_ADDRESS)
          ]
          incoming_fees.sort(key=lambda tx: int(first(tx, "blockNumber", "blockHeight", "block") or 0), reverse=True)
          incoming_fees = incoming_fees[:12]

          print("FEE_TRANSACTIONS")
          print(json.dumps([summary(tx) for tx in incoming_fees], indent=2, sort_keys=True))

          senders = []
          for tx in incoming_fees:
              sender = first(tx, "sender", "senderAddress", "from", "fromAddress")
              if sender and address_key(sender) not in {address_key(v) for v in senders}:
                  senders.append(str(sender))

          for sender in senders:
              history = transactions(rpc("getTransactionsByAddress", [sender, 100]))
              outgoing = [
                  tx for tx in history
                  if address_key(first(tx, "sender", "senderAddress", "from", "fromAddress")) == address_key(sender)
              ]
              outgoing.sort(key=lambda tx: int(first(tx, "blockNumber", "blockHeight", "block") or 0), reverse=True)
              print(f"OUTGOING_FROM {sender}")
              print(json.dumps([summary(tx) for tx in outgoing[:12]], indent=2, sort_keys=True))
          PY
