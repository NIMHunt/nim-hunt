name: Diagnose cancellation refunds

on:
  push:
    branches:
      - agent/diagnose-cancellation-refunds
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4

      - name: Inspect public TestAlbatross transaction history
        run: python .github/scripts/diagnose_cancellation_refunds.py
