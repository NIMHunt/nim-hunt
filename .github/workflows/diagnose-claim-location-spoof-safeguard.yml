name: Diagnose claim location safeguard

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/claim-location-spoof-safeguard'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Apply proposed changes
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-claim-location-spoof-safeguard.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          source = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end])
          exec(compile(source, str(workflow), 'exec'))
          PY

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run focused tests and capture output
        id: focused
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          set -o pipefail
          python -m pytest tests/test_claim_location_spoofing.py -q 2>&1 | tee diagnostics/location-spoof-test.log

      - name: Commit diagnostic output
        run: |
          git config user.name "NimHunt Agent"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostics/location-spoof-test.log
          git commit -m "Capture location safeguard test failure"
          git push origin HEAD:${{ github.head_ref }}

      - name: Fail when focused tests failed
        if: steps.focused.outcome != 'success'
        run: exit 1
