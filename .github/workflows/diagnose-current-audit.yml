name: Diagnose current dependency audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose-audit:
    if: github.head_ref == 'agent/claim-location-spoof-safeguard'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: helpers/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm ci --prefix helpers

      - name: Capture audit output
        run: |
          set +e
          {
            echo '=== pip-audit ==='
            python -m pip_audit --progress-spinner off
            echo "pip_audit_exit=$?"
            echo
            echo '=== npm audit ==='
            npm audit --omit=dev --prefix helpers
            echo "npm_audit_exit=$?"
          } > dependency_audit_diagnostic.txt 2>&1
          exit 0

      - name: Commit diagnostic output
        run: |
          git config user.name "NimHunt Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -f dependency_audit_diagnostic.txt
          git commit -m "Capture dependency audit diagnostic"
          git push origin HEAD:${{ github.head_ref }}
