name: Diagnose history and disclaimer patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/fix-history-cards-disclaimer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-history-cards-disclaimer

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run patch and capture output
        id: patch
        continue-on-error: true
        run: |
          python .github/scripts/apply_history_disclaimer_patch.py > patch-output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: history-disclaimer-patch-output
          path: patch-output.txt

      - name: Stop after diagnostics
        if: steps.patch.outputs.exit_code != '0'
        run: exit 1
