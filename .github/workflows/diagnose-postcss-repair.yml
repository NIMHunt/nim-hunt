name: Diagnose PostCSS repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/claim-location-spoof-safeguard'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: helpers/package-lock.json

      - name: Apply repair and capture checks
        run: |
          set +e
          npm audit fix --package-lock-only --omit=dev --prefix helpers > postcss_repair_diagnostic.txt 2>&1
          echo "audit_fix_exit=$?" >> postcss_repair_diagnostic.txt
          npm ci --prefix helpers >> postcss_repair_diagnostic.txt 2>&1
          echo "npm_ci_exit=$?" >> postcss_repair_diagnostic.txt
          npm test --prefix helpers >> postcss_repair_diagnostic.txt 2>&1
          echo "npm_test_exit=$?" >> postcss_repair_diagnostic.txt
          npm audit --omit=dev --prefix helpers >> postcss_repair_diagnostic.txt 2>&1
          echo "npm_audit_exit=$?" >> postcss_repair_diagnostic.txt
          echo >> postcss_repair_diagnostic.txt
          echo '=== lockfile diff ===' >> postcss_repair_diagnostic.txt
          git diff -- helpers/package-lock.json >> postcss_repair_diagnostic.txt
          exit 0

      - name: Commit diagnostic and proposed lockfile
        run: |
          git config user.name "NimHunt Agent"
          git config user.email "actions@users.noreply.github.com"
          git add helpers/package-lock.json
          git add -f postcss_repair_diagnostic.txt
          git commit -m "Capture PostCSS repair result"
          git push origin HEAD:${{ github.head_ref }}
