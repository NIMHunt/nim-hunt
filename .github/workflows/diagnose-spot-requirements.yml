name: Diagnose Spot requirement icons

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Capture pytest output
        run: pytest -vv > spot-requirements-pytest.txt 2>&1 || true
      - uses: actions/upload-artifact@v6
        with:
          name: spot-requirements-pytest
          path: spot-requirements-pytest.txt
