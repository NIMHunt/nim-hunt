name: Diagnose automatic X poster

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Capture targeted pytest output
        run: pytest tests/test_x_auto_poster.py tests/test_x_auto_poster_cursor_guard.py -vv > x-auto-poster-pytest.txt 2>&1 || true
      - uses: actions/upload-artifact@v6
        with:
          name: x-auto-poster-pytest
          path: x-auto-poster-pytest.txt
