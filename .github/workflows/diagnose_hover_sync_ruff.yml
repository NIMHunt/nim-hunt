name: Diagnose hover sync Ruff

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/map-list-hover-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Capture Ruff output
        run: ruff check . > ruff-output.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-output
          path: ruff-output.txt
