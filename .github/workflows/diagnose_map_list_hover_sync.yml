name: Diagnose map-list hover sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/map-list-hover-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Capture pytest output
        run: python -m pytest -q > pytest-output.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
