name: Export final release candidate

on:
  push:
    branches:
      - agent/final-release-polish

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/final-release-polish
      - name: Archive repository
        run: |
          tar \
            --exclude=.git \
            --exclude='.github/workflows/export-final-pass.yml' \
            --exclude='**/__pycache__' \
            --exclude='*.pyc' \
            -czf /tmp/nim-hunt-final-pass.tar.gz .
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: nim-hunt-final-pass
          path: /tmp/nim-hunt-final-pass.tar.gz
          retention-days: 1
