name: Apply and verify fee-card copy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@v4
        with:
          ref: agent/spot-creation-fees
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: helpers/package-lock.json

      - name: Apply requested copy changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          interface_path = Path('static/interface_text.js')
          interface_text = interface_path.read_text()
          old_deposit = """            confirmLead: ({ title }) => `Deposit NIM for '${title}'?`,
                      spotFundingLine: (amountText) => `Spot funding: ${amountText}.`,
                      creationFeeLine: (amountText) => `Creation fee: ${amountText}.`,
                      creationFeeNotice: 'The creation fee is deducted after full funding and is not refundable once confirmed.',
                      depositNowLine: (amountText) => `Deposit now: ${amountText}.`,
          """
          new_deposit = """            confirmLead: ({ title }) => `Deposit NIM for ${title}?`,
                      spotFundingLine: (amountText) => `Spot Funds: ${amountText}`,
                      creationFeeLine: (amountText) => `Creation Fee: ${amountText}`,
                      depositNowLine: (amountText) => `Total Deposit: ${amountText}`,
          """
          if old_deposit not in interface_text:
              raise SystemExit('Expected deposit-card text block was not found')
          interface_text = interface_text.replace(old_deposit, new_deposit, 1)
          old_cancel = "return `Are you sure you want to cancel '${title}'? Remaining funds will be returned, minus the cancellation fee. Estimated refund: ${refundText}. Cancellation fee: ${feeText}.`;"
          new_cancel = "return `Are you sure you want to cancel '${title}'? Remaining funds will be returned, minus the cancellation fee. Estimated refund: ${refundText} Cancellation fee: ${feeText}`;"
          if old_cancel not in interface_text:
              raise SystemExit('Expected cancellation fallback text was not found')
          interface_path.write_text(interface_text.replace(old_cancel, new_cancel, 1))

          spots_path = Path('static/my_spots.js')
          spots_text = spots_path.read_text()
          old_render = """        const creationFee = Number(data.creation_fee ?? spot.creation_fee ?? 0);
                  const lines = [
                      TEXT.deposit.confirmLead({ title }),
                      TEXT.deposit.spotFundingLine(spotValueText),
                      TEXT.deposit.creationFeeLine(creationFeeText),
                      TEXT.deposit.depositNowLine(amountText),
                  ];
                  if (creationFee > 0) {
                      lines.push(TEXT.deposit.creationFeeNotice);
                  }
          """
          new_render = """        const lines = [
                      TEXT.deposit.confirmLead({ title }),
                      TEXT.deposit.spotFundingLine(spotValueText),
                      TEXT.deposit.creationFeeLine(creationFeeText),
                      TEXT.deposit.depositNowLine(amountText),
                  ];
          """
          if old_render not in spots_text:
              raise SystemExit('Expected deposit-card rendering block was not found')
          spots_text = spots_text.replace(old_render, new_render, 1)
          spots_text = spots_text.replace('`Estimated refund: ${refundText}.`,', '`Estimated refund: ${refundText}`,', 1)
          spots_text = spots_text.replace('`Cancellation fee: ${feeText}.`,', '`Cancellation fee: ${feeText}`,', 1)
          spots_text = spots_text.replace(
              './interface_text.js?v=qol-v1-20260717',
              './interface_text.js?v=spot-fee-copy-v1-20260718',
              1,
          )
          spots_path.write_text(spots_text)

          public_path = Path('public_html.py')
          public_text = public_path.read_text()
          old_version = '_ASSET_VERSION = "qol-v1-20260717"'
          if old_version not in public_text:
              raise SystemExit('Expected asset version was not found')
          public_path.write_text(public_text.replace(
              old_version,
              '_ASSET_VERSION = "spot-fee-copy-v1-20260718"',
              1,
          ))
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff
          npm ci --prefix helpers

      - name: Run complete verification
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -W error::ResourceWarning -m pytest -q
          npm --prefix helpers test
          python -m py_compile *.py tests/*.py
          ruff check .
          for file in static/*.js; do node --check --input-type=module < "$file"; done
          for file in helpers/*.mjs; do node --check "$file"; done
          for file in *.sh; do bash -n "$file"; done
          git diff --check
          grep -F "Spot Funds: \${amountText}" static/interface_text.js
          grep -F "Creation Fee: \${amountText}" static/interface_text.js
          grep -F "Total Deposit: \${amountText}" static/interface_text.js
          ! grep -F "creationFeeNotice" static/interface_text.js
          ! grep -F 'Estimated refund: ${refundText}.' static/my_spots.js
          ! grep -F 'Cancellation fee: ${feeText}.' static/my_spots.js

      - name: Commit verified copy change
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/export_spot_creation_fee_branch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add static/interface_text.js static/my_spots.js public_html.py .github/workflows/export_spot_creation_fee_branch.yml
          git diff --cached --check
          git commit -m "Simplify deposit and cancellation card copy"
          git push origin HEAD:agent/spot-creation-fees
