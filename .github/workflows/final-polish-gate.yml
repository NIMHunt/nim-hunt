name: Apply and verify final release polish

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out release-polish branch
        uses: actions/checkout@v6
        with:
          ref: agent/final-release-polish
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: helpers/package-lock.json

      - name: Apply checksum-verified polish patch
        run: |
          cat \
            .github/final-polish-part00.patch \
            .github/final-polish-part01.patch \
            .github/final-polish-part02.patch \
            .github/final-polish-part03.patch \
            > /tmp/final-polish.patch
          echo "f98efce29036e820a16015ab04a510ada118871d86c7d4c06f695ddac068e267  /tmp/final-polish.patch" | sha256sum --check
          git apply --check /tmp/final-polish.patch
          git apply /tmp/final-polish.patch
          rm -f \
            .github/final-polish-part00.patch \
            .github/final-polish-part01.patch \
            .github/final-polish-part02.patch \
            .github/final-polish-part03.patch \
            .github/workflows/final-polish-gate.yml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm ci --prefix helpers

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run Node tests
        run: npm test --prefix helpers

      - name: Run static checks
        run: |
          ruff check .
          python -m compileall -q *.py tests
          for file in static/*.js; do node --check --input-type=module < "$file"; done
          for file in helpers/*.mjs; do node --check "$file"; done
          for file in *.sh; do bash -n "$file"; done

      - name: Compile Jinja templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader

          templates = Path("templates")
          environment = Environment(loader=FileSystemLoader(templates))
          for path in sorted(templates.glob("*.html")):
              environment.get_template(path.name)
          print(f"Compiled {len(list(templates.glob('*.html')))} templates")
          PY

      - name: Seed and inspect a fresh schema-version-2 database
        env:
          NIMHUNT_DB_PATH: ${{ runner.temp }}/nimhunt-final-pass.db
          NIMHUNT_DEPLOYMENT_MODE: development
          NIMHUNT_NIMIQ_NETWORK: TestAlbatross
          NIMHUNT_NIMIQ_ALLOW_DEFAULT_TEST_MNEMONIC: "yes"
        run: |
          python spoof.py
          python - <<'PY'
          import os
          import sqlite3

          connection = sqlite3.connect(os.environ["NIMHUNT_DB_PATH"])
          version = connection.execute("PRAGMA user_version;").fetchone()
          assert version == (2,), version
          metadata = dict(connection.execute("SELECT key, value FROM app_metadata"))
          assert metadata["nimiq_network"] == "TestAlbatross", metadata
          assert metadata["nimiq_network_id"] == "5", metadata
          assert metadata["deployment_mode"] == "development", metadata
          connection.close()
          PY

      - name: Exercise development startup
        env:
          NIMHUNT_DB_PATH: ${{ runner.temp }}/nimhunt-final-pass.db
          NIMHUNT_DEPLOYMENT_MODE: development
          NIMHUNT_NIMIQ_NETWORK: TestAlbatross
          NIMHUNT_NIMIQ_ALLOW_DEFAULT_TEST_MNEMONIC: "yes"
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 >/tmp/nimhunt-startup.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/nimhunt-startup.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/ >/dev/null
          curl --fail --silent http://127.0.0.1:8000/spots >/dev/null
          curl --fail --silent http://127.0.0.1:8000/my-spots >/dev/null
          curl --fail --silent http://127.0.0.1:8000/static/interface_text.js >/dev/null

      - name: Audit dependencies
        run: |
          python -m pip check
          python -m pip_audit --progress-spinner off
          npm audit --omit=dev --prefix helpers

      - name: Commit verified release polish
        run: |
          test ! -e .github/workflows/final-polish-gate.yml
          test ! -e .github/final-polish-part00.patch
          test ! -e .github/final-polish-part01.patch
          test ! -e .github/final-polish-part02.patch
          test ! -e .github/final-polish-part03.patch
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish final release candidate"
          git push origin HEAD:agent/final-release-polish
