name: Apply and test financial hardening

on:
  push:
    branches:
      - agent/harden-financial-finality

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: agent/harden-financial-finality
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply, test, and publish result
        shell: bash
        run: |
          set +e
          python -m pip install --upgrade pip > /tmp/financial-hardening.log 2>&1
          python -m pip install -r requirements.txt >> /tmp/financial-hardening.log 2>&1
          install_status=$?

          printf '%s' '' | base64 --decode > /tmp/patch_repo.py
          if [ "$install_status" -eq 0 ]; then
            python /tmp/patch_repo.py >> /tmp/financial-hardening.log 2>&1
            patch_status=$?
          else
            patch_status=99
          fi

          if [ "$patch_status" -eq 0 ]; then
            python -m py_compile database.py db_access.py trans_updater.py settlement_updater.py public_html.py main.py constants.py spoof.py tests/test_financial_finality.py >> /tmp/financial-hardening.log 2>&1
            compile_status=$?
          else
            compile_status=99
          fi

          if [ "$compile_status" -eq 0 ]; then
            python -m unittest discover -s tests -v >> /tmp/financial-hardening.log 2>&1
            test_status=$?
          else
            test_status=99
          fi

          if [ "$test_status" -eq 0 ]; then
            bash -n nimhunt_start_dev.sh >> /tmp/financial-hardening.log 2>&1
            shell_one=$?
            bash -n nimhunt_reset_mock_data.sh >> /tmp/financial-hardening.log 2>&1
            shell_two=$?
            node --check helpers/nimiq_helper.mjs >> /tmp/financial-hardening.log 2>&1
            node_status=$?
            git diff --check >> /tmp/financial-hardening.log 2>&1
            diff_status=$?
          else
            shell_one=99
            shell_two=99
            node_status=99
            diff_status=99
          fi

          git config user.name "NimHunt Review Bot"
          git config user.email "actions@users.noreply.github.com"

          if [ "$install_status" -eq 0 ] && [ "$patch_status" -eq 0 ] && [ "$compile_status" -eq 0 ] && [ "$test_status" -eq 0 ] && [ "$shell_one" -eq 0 ] && [ "$shell_two" -eq 0 ] && [ "$node_status" -eq 0 ] && [ "$diff_status" -eq 0 ]; then
            rm -f .github/workflows/financial-hardening.yml .financial-hardening-report.txt
            git add -A
            git commit -m "Harden transaction finality and standard payouts"
          else
            git reset --hard HEAD
            {
              echo "install_status=$install_status"
              echo "patch_status=$patch_status"
              echo "compile_status=$compile_status"
              echo "test_status=$test_status"
              echo "shell_one=$shell_one"
              echo "shell_two=$shell_two"
              echo "node_status=$node_status"
              echo "diff_status=$diff_status"
              echo
              cat /tmp/financial-hardening.log
            } > .financial-hardening-report.txt
            git add .financial-hardening-report.txt
            git commit -m "Record financial hardening test failure"
          fi

          git push origin HEAD:agent/harden-financial-finality
