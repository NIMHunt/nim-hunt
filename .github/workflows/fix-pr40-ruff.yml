name: Fix PR 40 Ruff

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/transaction-integrity-status-fixes
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: pip install -r requirements-dev.txt
      - name: Organise imports
        run: ruff check --fix tests/test_transaction_integrity_regressions.py
      - name: Remove temporary workflow files
        run: rm -f .github/workflows/diagnose-pr40-ruff.yml .github/workflows/fix-pr40-ruff.yml
      - name: Validate
        run: |
          ruff check .
          git diff --check
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix transaction regression test imports"
          git push origin HEAD:agent/transaction-integrity-status-fixes
