name: Fix Spot duplication test fixture

on:
  push:
    branches:
      - agent/duplicate-spots-as-drafts
    paths:
      - .github/workflows/fix-spot-duplicate-test-fixture.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/duplicate-spots-as-drafts
          fetch-depth: 0
      - run: python tools/fix_spot_duplicate_test_fixture.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Spot duplication test fixture"
          git push origin HEAD:agent/duplicate-spots-as-drafts
