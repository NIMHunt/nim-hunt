name: Fix hover sync Ruff

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/map-list-hover-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Apply Ruff fixes
        run: ruff check --fix tests/test_map_list_hover_sync.py tests/test_find_spots_map_interactions.py
      - name: Remove temporary workflow
        run: rm .github/workflows/fix_hover_sync_ruff.yml
      - name: Commit fix
        run: |
          git config user.name 'NIMHunt'
          git config user.email 'noreply@github.com'
          git add -A
          git commit -m 'Apply Ruff formatting to hover sync tests'
          git push origin HEAD:${{ github.head_ref }}
