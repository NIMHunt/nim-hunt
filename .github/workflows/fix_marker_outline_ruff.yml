name: Fix marker outline Ruff

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/preserve-marker-white-outline'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Apply Ruff fix
        run: ruff check --fix tests/test_marker_hover_outline.py tests/test_map_list_hover_sync.py
      - name: Remove temporary workflow
        run: rm .github/workflows/fix_marker_outline_ruff.yml
      - name: Commit formatting
        run: |
          git config user.name 'NIMHunt'
          git config user.email 'noreply@github.com'
          git add -A
          git commit -m 'Format marker outline regression tests'
          git push origin HEAD:${{ github.head_ref }}
