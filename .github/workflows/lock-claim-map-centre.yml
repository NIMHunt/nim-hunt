name: Lock claim map centre

on:
  push:
    branches:
      - agent/detail-map-zoom-limits

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/detail-map-zoom-limits
          fetch-depth: 0
      - name: Keep claim viewport Spot-centred
        run: |
          python -c "from pathlib import Path; p=Path('static/claim_detail.js'); s=p.read_text(); s=s.replace('    const bounds = metreBoundsAround(centre[0], centre[1], spot.radius);\n','').replace('        bounds.extend(userLatLng);\n','').replace('    const radiusBounds = metreBoundsAround(centre[0], centre[1], spot.radius).pad(0.18);\n    const paddedBounds = bounds.pad(0.18);','    const radiusBounds = metreBoundsAround(centre[0], centre[1], spot.radius).pad(0.18);').replace('        map.fitBounds(paddedBounds, { animate: false, maxZoom: 16 });','        map.fitBounds(radiusBounds, { animate: false, maxZoom: 16 });'); p.write_text(s)"
          python -c "from pathlib import Path; p=Path('tests/test_detail_map_zoom_controls.py'); s=p.read_text(); needle='    assert \"map.setMinZoom(minZoom);\" in page\n\n\ndef test_detail_map_cache_keys_are_bumped():'; repl='    assert \"map.setMinZoom(minZoom);\" in page\n    assert \"bounds.extend(userLatLng);\" not in page\n    assert \"map.fitBounds(radiusBounds, { animate: false, maxZoom: 16 });\" in page\n\n\ndef test_detail_map_cache_keys_are_bumped():'; assert needle in s; p.write_text(s.replace(needle,repl,1))"
      - name: Validate
        run: |
          node --check static/claim_detail.js
          python -m pip install pytest >/dev/null
          python -m pytest -q tests/test_detail_map_zoom_controls.py
      - name: Commit and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lock-claim-map-centre.yml
          git add static/claim_detail.js tests/test_detail_map_zoom_controls.py
          git commit -m "Keep Claim Detail map centred on its Spot"
          git push origin HEAD:agent/detail-map-zoom-limits
