name: One-time mnemonic cleanup

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/mnemonic-cleanup-trigger

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: helpers/package-lock.json

      - name: Install pinned helper dependencies
        run: npm ci --prefix helpers

      - name: Inspect MnemonicUtils
        run: |
          cd helpers
          node --input-type=module <<'NODE' > /tmp/mnemonic-api.txt
          import * as NimiqModule from '@nimiq/core';
          const Nimiq = (NimiqModule.default && NimiqModule.default.MnemonicUtils)
            ? NimiqModule.default
            : NimiqModule;
          console.log('MnemonicUtils properties:');
          console.log(Object.getOwnPropertyNames(Nimiq.MnemonicUtils).sort().join('\n'));
          console.log('Module mnemonic-related exports:');
          console.log(Object.keys(Nimiq).filter(key => /mnemonic|entropy/i.test(key)).sort().join('\n'));
          NODE

      - name: Upload API inspection
        uses: actions/upload-artifact@v4
        with:
          name: mnemonic-api-inspection
          path: /tmp/mnemonic-api.txt
          if-no-files-found: error
          retention-days: 1
