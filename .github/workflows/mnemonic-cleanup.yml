name: One-time mnemonic cleanup

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/mnemonic-cleanup-trigger

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run cleanup diagnostically
        run: |
          set +e
          git show origin/main:scripts/mnemonic_cleanup.py > /tmp/mnemonic_cleanup.py
          python /tmp/mnemonic_cleanup.py > /tmp/cleanup.log 2>&1
          echo "$?" > /tmp/cleanup-status.txt
          git diff --binary > /tmp/cleanup.patch
          cp .github/mnemonic-cleanup-report.txt /tmp/mnemonic-cleanup-report.txt 2>/dev/null || true
          exit 0

      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: mnemonic-cleanup-diagnostics
          path: |
            /tmp/cleanup.log
            /tmp/cleanup-status.txt
            /tmp/cleanup.patch
            /tmp/mnemonic-cleanup-report.txt
          if-no-files-found: error
          retention-days: 1
