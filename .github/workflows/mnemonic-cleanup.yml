name: One-time mnemonic cleanup

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/mnemonic-cleanup-trigger

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: helpers/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm ci --prefix helpers

      - name: Apply cleanup and record diagnostics
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git show origin/main:scripts/mnemonic_cleanup.py > /tmp/mnemonic_cleanup.py
          python /tmp/mnemonic_cleanup.py
          git config user.name 'NIMHunt'
          git config user.email '300551717+NIMHunt@users.noreply.github.com'
          git add -A
          git commit -m 'Apply mnemonic cleanup'
          git push origin HEAD:"${TARGET_BRANCH}"

      - name: Require an empty diagnostic report
        run: |
          if [ -s .github/mnemonic-cleanup-report.txt ]; then
            cat .github/mnemonic-cleanup-report.txt
            exit 1
          fi

      - name: Run complete verification
        run: |
          python -m pytest -q
          npm test --prefix helpers
          ruff check .
          python -m compileall -q *.py tests
          for file in static/*.js; do node --check --input-type=module < "$file"; done
          for file in helpers/*.mjs; do node --check "$file"; done
          for file in *.sh; do bash -n "$file"; done
          python -m pip check
          python -m pip_audit --progress-spinner off
          npm audit --omit=dev --prefix helpers

      - name: Finalise verified cleanup
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          rm -f .github/mnemonic-cleanup-report.txt .github/mnemonic-cleanup-trigger
          git add -A
          git commit -m 'Verify mnemonic cleanup'
          git push origin HEAD:"${TARGET_BRANCH}"
