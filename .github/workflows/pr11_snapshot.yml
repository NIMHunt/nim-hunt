name: PR11 Snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Archive source
        run: |
          tar \
            --exclude=.git \
            --exclude=venv \
            --exclude='**/__pycache__' \
            --exclude='*.pyc' \
            --exclude=records.db \
            -czf /tmp/nimhunt-pr11-source.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: nimhunt-pr11-source
          path: /tmp/nimhunt-pr11-source.tar.gz
          retention-days: 1
