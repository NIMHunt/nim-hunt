name: Apply PR 4 fresh-schema policy

on:
  push:
    branches:
      - codex/fix-production-safety-validation-issues-xwpbd9

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-production-safety-validation-issues-xwpbd9

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Decode fresh-schema patch
        run: echo '' | base64 -d > /tmp/pr4_fresh_schema_patch.py

      - name: Apply fresh-schema patch
        run: python /tmp/pr4_fresh_schema_patch.py

      - name: Run full tests
        run: python -m unittest discover -s tests -v

      - name: Compile changed Python files
        run: python -m py_compile database.py spoof.py db_access.py trans_updater.py tests/test_robustness_guards.py

      - name: Validate reset shell script
        run: bash -n nimhunt_reset_mock_data.sh

      - name: Commit tested fresh-schema policy
        shell: bash
        run: |
          rm .github/workflows/pr4-fresh-schema.yml
          git config user.name "NimHunt maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add database.py spoof.py nimhunt_reset_mock_data.sh tests/test_robustness_guards.py .github/workflows/pr4-fresh-schema.yml
          git commit -m "Use fresh development databases instead of migrations"
          git push origin HEAD:codex/fix-production-safety-validation-issues-xwpbd9
