name: Apply PR 4 safety fixes

on:
  workflow_dispatch:
  push:
    branches:
      - codex/fix-production-safety-validation-issues-xwpbd9

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-production-safety-validation-issues-xwpbd9

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Decode safety correction script
        run: echo '' | base64 --decode > /tmp/apply_pr4_safety_fix.py

      - name: Apply safety corrections
        run: python /tmp/apply_pr4_safety_fix.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile changed Python files
        run: python -m py_compile database.py db_access.py trans_updater.py tests/test_robustness_guards.py

      - name: Commit tested corrections
        shell: bash
        run: |
          rm .github/workflows/pr4-safety-fix.yml
          git config user.name "NimHunt maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add database.py db_access.py trans_updater.py tests/test_robustness_guards.py .github/workflows/pr4-safety-fix.yml
          git commit -m "Close cancellation and claim transaction races"
          git push origin HEAD:codex/fix-production-safety-validation-issues-xwpbd9
