name: Apply PR 4 safety fixes

on:
  push:
    branches:
      - codex/fix-production-safety-validation-issues-xwpbd9

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-production-safety-validation-issues-xwpbd9

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply safety corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, *, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # database.py: enforce the two race-sensitive invariants in SQLite.
          # ------------------------------------------------------------------
          path = Path("database.py")
          text = path.read_text()

          claim_code_marker = "\n\n\n# CLAIM_CODE #"
          claim_trigger = '''

# Prevents a claim insert after cancellation has been durably marked.
# This closes the final race even if application checks ran just before the
# cancellation transaction acquired SQLite's write lock.
CLAIM_TRIGGER_BLOCK_CANCELLING_SPOT_INSERT = "trg_claim_block_cancelling_spot_insert"
CLAIM_TRIGGER_BLOCK_CANCELLING_SPOT_INSERT_QUERY = f"""
CREATE TRIGGER IF NOT EXISTS {CLAIM_TRIGGER_BLOCK_CANCELLING_SPOT_INSERT}
BEFORE INSERT ON {CLAIM_TABLE_NAME}
FOR EACH ROW
WHEN EXISTS (
    SELECT 1
    FROM {SPOT_TABLE_NAME}
    WHERE {SPOT_ID} = NEW.{CLAIM_SPOT_ID}
      AND {SPOT_CANCELLATION_STARTED_AT} IS NOT NULL
)
BEGIN
    SELECT RAISE(ABORT, 'spot cancellation has started');
END;
"""
'''
          text = replace_once(
              text,
              claim_code_marker,
              claim_trigger + claim_code_marker,
              label="insert claim cancellation trigger",
          )

          queue_index_marker = "\n\n# Helps queue/review pending, confirmed, and failed transactions."
          cancellation_index = '''

# Prevents two requests from creating the same active cancellation leg.
# A failed leg remains retryable because failed rows are outside the index.
TRANS_INDEX_SPOT_ACTIVE_CANCELLATION_UNIQUE = "idx_trans_spot_active_cancellation_unique"
TRANS_INDEX_SPOT_ACTIVE_CANCELLATION_UNIQUE_QUERY = f"""
CREATE UNIQUE INDEX IF NOT EXISTS {TRANS_INDEX_SPOT_ACTIVE_CANCELLATION_UNIQUE}
ON {TRANS_TABLE_NAME}({TRANS_SPOT_ID}, {TRANS_TYPE})
WHERE {TRANS_SPOT_ID} IS NOT NULL
  AND {TRANS_TYPE} IN ({TRANS_TYPE_CANCEL_SPOT}, {TRANS_TYPE_PLAT_FEE})
  AND {TRANS_STATUS} != {TRANS_STATUS_FAILED};
"""
'''
          text = replace_once(
              text,
              queue_index_marker,
              cancellation_index + queue_index_marker,
              label="insert cancellation-leg unique index",
          )

          payout_column_marker = "\n\nasync def _ensure_claim_payout_address_column(db) -> None:"
          backfill = '''

async def _backfill_spot_cancellation_markers(db) -> None:
    """Mark older Spots that already have cancellation transaction history."""
    await db.execute(
        f"""
        UPDATE {SPOT_TABLE_NAME} AS s
        SET {SPOT_CANCELLATION_STARTED_AT} = COALESCE(
            s.{SPOT_CANCELLATION_STARTED_AT},
            s.{SPOT_UPDATED_AT},
            s.{SPOT_CREATED_AT},
            unixepoch()
        )
        WHERE s.{SPOT_CANCELLATION_STARTED_AT} IS NULL
          AND EXISTS (
              SELECT 1
              FROM {TRANS_TABLE_NAME} AS t
              WHERE t.{TRANS_SPOT_ID} = s.{SPOT_ID}
                AND t.{TRANS_TYPE} IN ({TRANS_TYPE_CANCEL_SPOT}, {TRANS_TYPE_PLAT_FEE})
          );
        """
    )
'''
          text = replace_once(
              text,
              payout_column_marker,
              backfill + payout_column_marker,
              label="insert cancellation marker backfill",
          )

          text = replace_once(
              text,
              "        await db.executescript(CLAIM_TRIGGER_STAMP_UPDATED_AT_QUERY)\n",
              "        await db.executescript(CLAIM_TRIGGER_STAMP_UPDATED_AT_QUERY)\n"
              "        await db.executescript(CLAIM_TRIGGER_BLOCK_CANCELLING_SPOT_INSERT_QUERY)\n",
              label="install claim cancellation trigger",
          )
          text = replace_once(
              text,
              "        await db.executescript(CREATE_TRANS_TABLE)\n",
              "        await db.executescript(CREATE_TRANS_TABLE)\n"
              "        await _backfill_spot_cancellation_markers(db)\n",
              label="backfill cancellation markers",
          )
          text = replace_once(
              text,
              "        await db.executescript(TRANS_INDEX_CLAIM_ACTIVE_PAYOUT_UNIQUE_QUERY)\n",
              "        await db.executescript(TRANS_INDEX_CLAIM_ACTIVE_PAYOUT_UNIQUE_QUERY)\n"
              "        await db.executescript(TRANS_INDEX_SPOT_ACTIVE_CANCELLATION_UNIQUE_QUERY)\n",
              label="install cancellation-leg unique index",
          )
          path.write_text(text)

          # ------------------------------------------------------------------
          # db_access.py: rely on the caller's existing transaction and the DB
          # trigger; do not start/commit a nested transaction inside a helper.
          # ------------------------------------------------------------------
          path = Path("db_access.py")
          text = path.read_text()
          function_start = text.index("async def create_claim_attempt(")
          block_start = text.index('    try:\n        await db.execute("BEGIN IMMEDIATE;")', function_start)
          block_end = text.index("    claim = await get_claim(db, claim_id=claim_id)", block_start)
          replacement = '''    # Recheck immediately before writing for a friendly error. The SQLite
    # trigger is the authoritative race-safe guard if cancellation begins after
    # this check but before the INSERT obtains the write lock.
    if await has_spot_cancellation_started(db, spot_id=spot_id):
        raise ValueError("This spot is being cancelled and can no longer be claimed.")

    try:
        claim_id = await create_claim(
            db,
            spot_id=spot_id,
            user_id=user_id,
            lat=lat,
            long=long,
            accuracy=accuracy_score,
            payout_address=payout_address,
        )
    except sqlite3.IntegrityError as exc:
        if "spot cancellation has started" in str(exc).lower():
            raise ValueError("This spot is being cancelled and can no longer be claimed.") from exc
        raise

    if use_password and clean_code:
        await claim_code_for_claim(
            db,
            spot_id=spot_id,
            claim_code=clean_code,
            claim_id=claim_id,
        )

    # A zero-duration claim/entry succeeds immediately.
    # For Prizedraws, SUCCESS means the user has successfully entered the draw;
    # winning is later inferred from a related CLAIM payout transaction.
    if claim_duration <= 0:
        claim_after = await promote_pending_claim_to_success_if_capacity_available(db, claim_id=claim_id)
        promotion = claim_after.get("capacity_promotion") if isinstance(claim_after, dict) else None
        if isinstance(promotion, dict) and promotion.get("ok") is False:
            raise ValueError("This spot has run out of rewards.")
        if claim_after is not None:
            return claim_after

'''
          text = text[:block_start] + replacement + text[block_end:]
          path.write_text(text)

          # ------------------------------------------------------------------
          # trans_updater.py: translate the database cancellation-leg invariant
          # into the existing friendly 409-style cancellation error.
          # ------------------------------------------------------------------
          path = Path("trans_updater.py")
          text = path.read_text()
          text = replace_once(
              text,
              "import secrets\n",
              "import secrets\nimport sqlite3\n",
              label="import sqlite3",
          )
          old_sends = '''    fee_result = await submit_platform_fee_transaction(
        db,
        spot_id=int(spot_id),
        amount=fee_amount,
        fee_address=fee_address,
    ) if fee_amount > 0 else {"ok": True, "skipped": True, "reason": "no_fee", "trans_id": None}

    refund_result = await submit_spot_refund_transaction(
        db,
        spot_id=int(spot_id),
        to_address=str(refund_address),
        amount=refund_amount,
    ) if refund_amount > 0 else {"ok": True, "skipped": True, "reason": "no_refund", "trans_id": None}
'''
          new_sends = '''    try:
        fee_result = await submit_platform_fee_transaction(
            db,
            spot_id=int(spot_id),
            amount=fee_amount,
            fee_address=fee_address,
        ) if fee_amount > 0 else {"ok": True, "skipped": True, "reason": "no_fee", "trans_id": None}

        refund_result = await submit_spot_refund_transaction(
            db,
            spot_id=int(spot_id),
            to_address=str(refund_address),
            amount=refund_amount,
        ) if refund_amount > 0 else {"ok": True, "skipped": True, "reason": "no_refund", "trans_id": None}
    except sqlite3.IntegrityError as exc:
        message = str(exc).lower()
        if "trans.spot_id" in message and "trans.type" in message:
            raise ValueError(
                "This spot already has an active cancellation transaction. "
                "Wait for it to confirm or fail before retrying."
            ) from exc
        raise
'''
          text = replace_once(text, old_sends, new_sends, label="guard duplicate cancellation sends")
          path.write_text(text)

          # ------------------------------------------------------------------
          # Tests: exercise real SQLite transactions/triggers/indexes rather
          # than relying only on FakeDb mocks.
          # ------------------------------------------------------------------
          path = Path("tests/test_robustness_guards.py")
          text = path.read_text()
          if "import sqlite3\n" not in text:
              text = replace_once(text, "import tempfile\n", "import sqlite3\nimport tempfile\n", label="import sqlite3 in tests")

          extra_tests = r'''

class RealDatabaseCancellationInvariantTest(unittest.IsolatedAsyncioTestCase):
    async def asyncSetUp(self):
        self._tmp = tempfile.NamedTemporaryFile(suffix=".db", delete=True)
        self._old_db_path = schema.DB_PATH
        schema.DB_PATH = self._tmp.name
        await schema.init_db()

    async def asyncTearDown(self):
        schema.DB_PATH = self._old_db_path
        self._tmp.close()

    async def _fixture(self):
        async with schema.get_db() as db:
            owner_id = await db_access.create_user(db, device_id_hash="owner-device")
            claimant_id = await db_access.create_user(db, device_id_hash="claimant-device")
            spot_id = await db_access.create_spot(db, created_by=owner_id, title="Guarded Spot")
            await db.execute(
                f"""
                UPDATE {schema.SPOT_TABLE_NAME}
                SET {schema.SPOT_STATUS} = ?,
                    {schema.SPOT_CLAIM_DURATION} = 1
                WHERE {schema.SPOT_ID} = ?;
                """,
                (const.SPOT_STATUS_PUBLISHED, spot_id),
            )
            await db.commit()
        return owner_id, claimant_id, spot_id

    async def test_claim_attempt_works_inside_existing_route_transaction(self):
        _owner_id, claimant_id, spot_id = await self._fixture()
        with mock.patch.object(db_access, "get_claim_rule_check", mock.AsyncMock(return_value={"allowed": True})), \
             mock.patch.object(db_access, "is_prizedraw", mock.AsyncMock(return_value=False)):
            async with schema.get_db() as db:
                async with db_access.transaction(db):
                    claim = await db_access.create_claim_attempt(
                        db,
                        spot_id=spot_id,
                        user_id=claimant_id,
                        lat=1.0,
                        long=2.0,
                    )

        self.assertGreater(int(claim[schema.CLAIM_ID]), 0)

    async def test_database_trigger_blocks_claim_if_marker_appears_after_app_check(self):
        _owner_id, claimant_id, spot_id = await self._fixture()
        async with schema.get_db() as db:
            await db.execute(
                f"""
                UPDATE {schema.SPOT_TABLE_NAME}
                SET {schema.SPOT_CANCELLATION_STARTED_AT} = unixepoch()
                WHERE {schema.SPOT_ID} = ?;
                """,
                (spot_id,),
            )
            await db.commit()

        with mock.patch.object(db_access, "get_claim_rule_check", mock.AsyncMock(return_value={"allowed": True})), \
             mock.patch.object(db_access, "is_prizedraw", mock.AsyncMock(return_value=False)), \
             mock.patch.object(db_access, "has_spot_cancellation_started", mock.AsyncMock(return_value=False)):
            async with schema.get_db() as db:
                with self.assertRaisesRegex(ValueError, "being cancelled"):
                    async with db_access.transaction(db):
                        await db_access.create_claim_attempt(
                            db,
                            spot_id=spot_id,
                            user_id=claimant_id,
                            lat=1.0,
                            long=2.0,
                        )

    async def test_duplicate_active_cancellation_leg_is_rejected_but_failed_leg_retries(self):
        owner_id, _claimant_id, spot_id = await self._fixture()
        async with schema.get_db() as db:
            first_id = await db_access.create_spot_refund_transaction(
                db,
                user_id=owner_id,
                spot_id=spot_id,
                amount=90,
                from_address="from",
                to_address="to",
                tx_hash="refund-intent-1",
            )
            await db.commit()

            with self.assertRaises(sqlite3.IntegrityError):
                await db_access.create_spot_refund_transaction(
                    db,
                    user_id=owner_id,
                    spot_id=spot_id,
                    amount=90,
                    from_address="from",
                    to_address="to",
                    tx_hash="refund-intent-2",
                )
            await db.rollback()

            await db_access.set_transaction_status_to_failed(db, trans_id=first_id)
            retry_id = await db_access.create_spot_refund_transaction(
                db,
                user_id=owner_id,
                spot_id=spot_id,
                amount=90,
                from_address="from",
                to_address="to",
                tx_hash="refund-intent-3",
            )
            await db.commit()

        self.assertNotEqual(first_id, retry_id)
'''
          if "class RealDatabaseCancellationInvariantTest" in text:
              raise RuntimeError("real database cancellation tests already exist")
          text += extra_tests
          path.write_text(text)
          PY

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile changed Python files
        run: python -m py_compile database.py db_access.py trans_updater.py tests/test_robustness_guards.py

      - name: Commit tested corrections
        shell: bash
        run: |
          rm .github/workflows/pr4-safety-fix.yml
          git config user.name "NimHunt maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add database.py db_access.py trans_updater.py tests/test_robustness_guards.py .github/workflows/pr4-safety-fix.yml
          git commit -m "Close cancellation and claim transaction races"
          git push origin HEAD:codex/fix-production-safety-validation-issues-xwpbd9
