name: Verify PR 5 review fixes

on:
  push:
    branches:
      - agent/harden-financial-finality

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/harden-financial-finality
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply second-review fixes
        run: python .pr5-review-fixes.py

      - name: Check syntax
        run: |
          python -m py_compile database.py db_access.py trans_updater.py settlement_updater.py public_html.py main.py constants.py spoof.py tests/test_financial_finality.py
          bash -n nimhunt_start_dev.sh
          bash -n nimhunt_reset_mock_data.sh
          node --check helpers/nimiq_helper.mjs
          git diff --check

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Commit verified changes
        shell: bash
        run: |
          rm -f .github/workflows/pr5-review-fixes.yml
          rm -f .pr5-review-fixes.py .pr5-review-trigger
          git config user.name "NimHunt Review Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Tighten payout error and final-state handling"
          git push origin HEAD:agent/harden-financial-finality
