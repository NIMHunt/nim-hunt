name: Apply and verify production hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reassemble and apply verified patch
        run: |
          cat .github/production-hardening-patch/chunk-* > /tmp/hardening.patch.b64
          echo "3ada7a76ca90860e3bd4c40f96e5c7cfe3fa5fe95bad14c57e41187b4cec69c8  /tmp/hardening.patch.b64" | sha256sum --check
          base64 --decode /tmp/hardening.patch.b64 > /tmp/hardening.patch
          echo "4fa34916fd50304aab0268c66dfdf5fbc59490fc94d59a9107f5ecb475347024  /tmp/hardening.patch" | sha256sum --check
          git apply --check /tmp/hardening.patch
          git apply /tmp/hardening.patch
          rm -rf .github/production-hardening-patch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff
          npm ci --prefix helpers

      - name: Run Python tests
        run: PYTHONPATH=. python -m pytest -q

      - name: Run Nimiq helper tests
        run: npm --prefix helpers test

      - name: Run static checks
        run: |
          python -m py_compile *.py tests/*.py
          ruff check .
          for file in static/*.js; do node --check --input-type=module < "$file"; done
          for file in helpers/*.mjs; do node --check "$file"; done
          for file in *.sh; do bash -n "$file"; done
          git diff --check

      - name: Commit verified production hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Gate test helpers and label Nimiq transactions"
          git push origin HEAD:${{ github.head_ref }}
