name: Inspect public Testnet Python audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Reassemble and apply verified source patch
        run: |
          cat \
            .github/public-testnet-patch/chunk-00 \
            .github/public-testnet-patch/chunk-01 \
            .github/public-testnet-patch/chunk-02 \
            .github/public-testnet-patch/tail-{00..14} \
            > /tmp/public-testnet.patch.gz.b64
          echo "4c873df2411b7fa0a3c7704917ce43df5533d4cb488737f8e41253821a173c4f  /tmp/public-testnet.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/public-testnet.patch.gz.b64 > /tmp/public-testnet.patch.gz
          echo "05472faaa09a68549a142200adb97ae8aab057560f4870878f2d782266f19dec  /tmp/public-testnet.patch.gz" | sha256sum --check
          gzip -dc /tmp/public-testnet.patch.gz > /tmp/public-testnet.patch
          echo "6a5822c1591229a53d3687724a48b08907a7037f7ec54f3639629d4ade0e305d  /tmp/public-testnet.patch" | sha256sum --check
          git apply --exclude=.github/workflows/public_testnet_snapshot.yml /tmp/public-testnet.patch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and auditor
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit

      - name: Record audit report
        run: |
          set +e
          python -m pip_audit --format=json > /tmp/python-audit.json 2> /tmp/python-audit.err
          echo "$?" > /tmp/python-audit.status
          set -e
          cat /tmp/python-audit.status

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: public-testnet-python-audit
          path: |
            /tmp/python-audit.json
            /tmp/python-audit.err
            /tmp/python-audit.status
          retention-days: 1
