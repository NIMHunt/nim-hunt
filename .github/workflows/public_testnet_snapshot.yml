name: Apply and verify public TestAlbatross deployment

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reassemble and apply verified patch
        run: |
          cat \
            .github/public-testnet-patch/chunk-00 \
            .github/public-testnet-patch/chunk-01 \
            .github/public-testnet-patch/chunk-02 \
            .github/public-testnet-patch/tail-{00..14} \
            > /tmp/public-testnet.patch.gz.b64
          echo "4c873df2411b7fa0a3c7704917ce43df5533d4cb488737f8e41253821a173c4f  /tmp/public-testnet.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/public-testnet.patch.gz.b64 > /tmp/public-testnet.patch.gz
          echo "05472faaa09a68549a142200adb97ae8aab057560f4870878f2d782266f19dec  /tmp/public-testnet.patch.gz" | sha256sum --check
          gzip -dc /tmp/public-testnet.patch.gz > /tmp/public-testnet.patch
          echo "6a5822c1591229a53d3687724a48b08907a7037f7ec54f3639629d4ade0e305d  /tmp/public-testnet.patch" | sha256sum --check
          git apply --check --exclude=.github/workflows/public_testnet_snapshot.yml /tmp/public-testnet.patch
          git apply --exclude=.github/workflows/public_testnet_snapshot.yml /tmp/public-testnet.patch
          rm -rf .github/public-testnet-patch
          rm -f .github/workflows/public_testnet_snapshot.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff pip-audit
          npm ci --prefix helpers

      - name: Run Python tests
        run: PYTHONPATH=. python -W error::ResourceWarning -m pytest -q

      - name: Run Node tests
        run: npm --prefix helpers test

      - name: Compile and lint Python
        run: |
          python -m py_compile *.py tests/*.py
          ruff check .

      - name: Check JavaScript and shell syntax
        run: |
          for file in static/*.js; do node --check --input-type=module < "$file"; done
          for file in helpers/*.mjs; do node --check "$file"; done
          for file in *.sh; do bash -n "$file"; done

      - name: Check Python dependencies
        run: |
          python -m pip check
          python -m pip_audit

      - name: Audit Nimiq helper dependencies
        run: npm audit --omit=dev --prefix helpers

      - name: Validate Railway configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          railway = json.loads(Path("railway.json").read_text())
          assert railway["build"]["builder"] == "RAILPACK"
          start = railway["deploy"]["startCommand"]
          assert "$PORT" in start
          assert "--workers 1" in start
          assert railway["deploy"]["healthcheckPath"] == "/healthz"
          mise = Path("mise.toml").read_text()
          assert 'python = "3.11"' in mise
          assert 'node = "20"' in mise
          PY

      - name: Check patch whitespace
        run: git diff --check

      - name: Compile all templates
        run: |
          PYTHONPATH=. python - <<'PY'
          import constants as const
          from jinja2 import Environment, FileSystemLoader

          environment = Environment(loader=FileSystemLoader(str(const.TEMPLATES_DIR)))
          for path in sorted(const.TEMPLATES_DIR.glob("*.html")):
              environment.get_template(path.name)
          PY

      - name: Seed and inspect a fresh development database
        run: |
          TMPDIR="$(mktemp -d)"
          NIMHUNT_DEPLOYMENT_MODE=development \
          NIMHUNT_DB_PATH="$TMPDIR/records.db" \
          PYTHONPATH=. python spoof.py
          DB_PATH="$TMPDIR/records.db" python - <<'PY'
          import os
          import sqlite3

          connection = sqlite3.connect(os.environ["DB_PATH"])
          try:
              metadata = dict(connection.execute(
                  "SELECT key, value FROM app_metadata"
              ).fetchall())
          finally:
              connection.close()
          assert metadata["nimiq_network"] == "TestAlbatross"
          assert metadata["nimiq_network_id"] == "5"
          assert metadata["deployment_mode"] == "development"
          PY
          rm -rf "$TMPDIR"

      - name: Exercise public-testnet startup and shutdown
        run: |
          cat > /tmp/nimhunt-test-signer.py <<'PY'
          #!/usr/bin/env python3
          import json
          import sys

          request = json.load(sys.stdin)
          if request.get("action") == "derive_spot_deposit_address":
              json.dump({
                  "address": "NQ45 1KUT 73F7 ADV4 UCT8 TX64 2DE4 CHBP SJBF",
                  "key_index": request.get("key_index", 0),
                  "key_path": request.get("key_path"),
                  "key_version": request.get("key_version", 1),
              }, sys.stdout)
          else:
              json.dump({"tx_hash": "unused-public-testnet-smoke-test"}, sys.stdout)
          PY
          chmod 700 /tmp/nimhunt-test-signer.py
          TMPDIR="$(mktemp -d)"
          env \
            NIMHUNT_DEPLOYMENT_MODE=public-testnet \
            NIMHUNT_DB_PATH="$TMPDIR/records.db" \
            NIMHUNT_NIMIQ_NETWORK=TestAlbatross \
            NIMHUNT_NIMIQ_NETWORK_ID=5 \
            NIMHUNT_NIMIQ_RPC_URL=https://rpc.testnet.nimiqwatch.com/ \
            NIMHUNT_NIMIQ_HUB_URL=https://hub.nimiq-testnet.com \
            NIMHUNT_NIMIQ_DERIVE_ADDRESS_COMMAND=/tmp/nimhunt-test-signer.py \
            NIMHUNT_NIMIQ_SEND_COMMAND=/tmp/nimhunt-test-signer.py \
            NIMHUNT_NIMIQ_EXTERNAL_SIGNER=1 \
            NIMHUNT_SPOT_CANCELLATION_FEE_ADDRESS='NQ45 1KUT 73F7 ADV4 UCT8 TX64 2DE4 CHBP SJBF' \
            PYTHONPATH=. python - <<'PY'
          import asyncio
          import os
          from pathlib import Path

          import main

          async def run() -> None:
              await main.startup()
              try:
                  assert Path(os.environ["NIMHUNT_DB_PATH"]).exists()
                  assert main.const.DEPLOYMENT_MODE == "public-testnet"
                  assert main.const.PUBLIC_DEPLOYMENT is True
                  assert main.const.PRODUCTION_MODE is False
                  assert main.const.TEST_FEATURES_ENABLED is False
              finally:
                  await main.shutdown()

          asyncio.run(run())
          PY
          rm -rf "$TMPDIR" /tmp/nimhunt-test-signer.py

      - name: Validate a production configuration without secrets in logs
        run: |
          TMPDIR="$(mktemp -d)"
          NIMHUNT_DEPLOYMENT_MODE=production \
          NIMHUNT_DB_PATH="$TMPDIR/records.db" \
          NIMHUNT_NIMIQ_NETWORK=MainAlbatross \
          NIMHUNT_NIMIQ_NETWORK_ID=24 \
          NIMHUNT_NIMIQ_RPC_URL=https://rpc.nimiqwatch.com \
          NIMHUNT_NIMIQ_HUB_URL=https://hub.nimiq.com \
          NIMHUNT_NIMIQ_DERIVE_ADDRESS_COMMAND=/private/external/signer \
          NIMHUNT_NIMIQ_SEND_COMMAND=/private/external/signer \
          NIMHUNT_NIMIQ_EXTERNAL_SIGNER=1 \
          NIMHUNT_SPOT_CANCELLATION_FEE_ADDRESS='NQ45 1KUT 73F7 ADV4 UCT8 TX64 2DE4 CHBP SJBF' \
          PYTHONPATH=. python - <<'PY'
          import main

          main.validate_deployment_safety()
          assert main.const.DEPLOYMENT_MODE == "production"
          assert main.const.PRODUCTION_MODE is True
          PY
          rm -rf "$TMPDIR"

      - name: Commit verified implementation
        run: |
          test ! -e .github/public-testnet-patch
          test ! -e .github/workflows/public_testnet_snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add safe public TestAlbatross deployment mode"
          git push origin HEAD:${{ github.head_ref }}
