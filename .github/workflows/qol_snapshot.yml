name: Apply and verify QoL improvements

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  qol:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reassemble and apply verified patch
        run: |
          cat \
            .github/qol-patch/chunk-00 \
            .github/qol-patch/chunk-01 \
            .github/qol-patch/chunk-02 \
            > /tmp/qol.patch.gz.b64
          echo "1d7fad40c67f72d6f0dd1863397f2fa678a5835c75a2aebf6097c7ae3b5e7e7e  /tmp/qol.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/qol.patch.gz.b64 > /tmp/qol.patch.gz
          echo "2a3a12e7ce545163d99f539e24bf55c697620b4b9774487dfa0f3412205c21c8  /tmp/qol.patch.gz" | sha256sum --check
          gzip -dc /tmp/qol.patch.gz > /tmp/qol.patch
          echo "cfa51efb454f6f9602a7831dbacfb3f0f8d197742f466d06094f4143e1f65957  /tmp/qol.patch" | sha256sum --check
          git apply --check /tmp/qol.patch
          git apply /tmp/qol.patch
          rm -rf .github/qol-patch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff pip-audit
          npm ci --prefix helpers

      - name: Run Python tests
        run: PYTHONPATH=. python -W error::ResourceWarning -m pytest -q

      - name: Run JavaScript tests
        run: npm --prefix helpers test

      - name: Run static and dependency checks
        run: |
          python -m py_compile *.py tests/*.py
          ruff check .
          for file in static/*.js; do node --check --input-type=module < "$file"; done
          for file in helpers/*.mjs; do node --check "$file"; done
          for file in *.sh; do bash -n "$file"; done
          python -m pip check
          python -m pip_audit
          npm audit --omit=dev --prefix helpers
          git diff --check

      - name: Compile all templates
        run: |
          PYTHONPATH=. python - <<'PY'
          import constants as const
          from jinja2 import Environment, FileSystemLoader

          environment = Environment(loader=FileSystemLoader(str(const.TEMPLATES_DIR)))
          for path in sorted(const.TEMPLATES_DIR.glob("*.html")):
              environment.get_template(path.name)
          PY

      - name: Seed a fresh mock database
        run: |
          TMPDIR="$(mktemp -d)"
          NIMHUNT_DB_PATH="$TMPDIR/records.db" PYTHONPATH=. python spoof.py
          test -s "$TMPDIR/records.db"
          rm -rf "$TMPDIR"

      - name: Run application startup smoke test
        run: |
          TMPDIR="$(mktemp -d)"
          NIMHUNT_DB_PATH="$TMPDIR/records.db" PYTHONPATH=. python - <<'PY'
          import asyncio
          import os
          from pathlib import Path

          import main

          async def run() -> None:
              await main.startup()
              try:
                  assert Path(os.environ["NIMHUNT_DB_PATH"]).exists()
              finally:
                  await main.shutdown()

          asyncio.run(run())
          PY
          rm -rf "$TMPDIR"

      - name: Commit verified QoL improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand operator docs and prepare localisation"
          git push origin HEAD:${{ github.head_ref }}
