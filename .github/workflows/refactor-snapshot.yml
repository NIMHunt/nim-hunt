name: Apply and verify refactor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reassemble and apply verified patch
        run: |
          cat .github/refactor-patch-safe/chunk-* > /tmp/refactor.patch.b64
          echo "5bb66db0b857bc90d018012957353f284abe01e1ebb4d6e632fa63aad62d4706  /tmp/refactor.patch.b64" | sha256sum --check
          base64 --decode /tmp/refactor.patch.b64 > /tmp/refactor.patch
          echo "119e2853cd4935bb783f692733d36231e4b792be4bf0113f399ba5b7d1ec1077  /tmp/refactor.patch" | sha256sum --check
          git apply --check /tmp/refactor.patch
          git apply /tmp/refactor.patch
          rm -rf .github/refactor-patch .github/refactor-patch-safe

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff

      - name: Run Python tests
        run: PYTHONPATH=. python -m pytest -q

      - name: Run static checks
        run: |
          python -m py_compile *.py tests/*.py
          ruff check .
          for file in static/*.js; do node --check --input-type=module < "$file"; done
          for file in helpers/*.mjs; do node --check "$file"; done
          for file in *.sh; do bash -n "$file"; done
          git diff --check

      - name: Commit verified refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor shared utilities and application lifecycle"
          git push origin HEAD:${{ github.head_ref }}
