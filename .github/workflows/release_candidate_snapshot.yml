name: Apply and verify release candidate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reassemble and apply verified patch
        run: |
          cat .github/release-candidate-patch/gz-* > /tmp/release.patch.gz.b64
          echo "5bdf660d5309878b429da27ae7d6d877a2637cb80b59b0552d145c5ca605d60c  /tmp/release.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/release.patch.gz.b64 > /tmp/release.patch.gz
          echo "b66bf8c43d850145da3362e3072468d60b1f39a87c0ca32a1e1b729c06dc1dee  /tmp/release.patch.gz" | sha256sum --check
          gzip -dc /tmp/release.patch.gz > /tmp/release.patch
          echo "ed2d5e035774967f55909be00a3e62553f8475bad5fe59b9bea0d00d7458085a  /tmp/release.patch" | sha256sum --check
          git apply --check --exclude=.github/workflows/release_candidate_snapshot.yml /tmp/release.patch
          git apply --exclude=.github/workflows/release_candidate_snapshot.yml /tmp/release.patch
          rm -rf .github/release-candidate-patch
          rm -f .github/workflows/release_candidate_snapshot.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff pip-audit
          npm ci --prefix helpers

      - name: Run Python tests
        run: PYTHONPATH=. python -W error::ResourceWarning -m pytest -q

      - name: Run Nimiq helper tests
        run: npm --prefix helpers test

      - name: Run static and dependency checks
        run: |
          python -m py_compile *.py tests/*.py
          ruff check .
          for file in static/*.js; do node --check --input-type=module < "$file"; done
          for file in helpers/*.mjs; do node --check "$file"; done
          for file in *.sh; do bash -n "$file"; done
          python -m pip check
          python -m pip_audit
          npm audit --omit=dev --prefix helpers
          git diff --check

      - name: Run application startup smoke test
        run: |
          TMPDIR="$(mktemp -d)"
          NIMHUNT_DB_PATH="$TMPDIR/records.db" PYTHONPATH=. python - <<'PY'
          import asyncio
          import os
          from pathlib import Path

          import main

          async def run() -> None:
              await main.startup()
              try:
                  assert Path(os.environ["NIMHUNT_DB_PATH"]).exists()
              finally:
                  await main.shutdown()

          asyncio.run(run())
          PY
          rm -rf "$TMPDIR"

      - name: Commit verified release candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete final release-candidate hardening"
          git push origin HEAD:${{ github.head_ref }}
