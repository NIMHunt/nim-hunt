name: Repair PostCSS audit for location PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.head_ref == 'agent/claim-location-spoof-safeguard'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: helpers/package-lock.json

      - name: Apply lockfile-only audit repair
        run: |
          npm audit fix --package-lock-only --omit=dev --prefix helpers
          npm ci --prefix helpers

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run complete repository verification
        env:
          NIMHUNT_DB_PATH: ${{ runner.temp }}/nimhunt-ci.db
          NIMHUNT_DEPLOYMENT_MODE: development
          NIMHUNT_NIMIQ_NETWORK: TestAlbatross
          NIMHUNT_NIMIQ_ALLOW_DEFAULT_TEST_MNEMONIC: "1"
        run: |
          python -m pytest -q
          npm test --prefix helpers
          ruff check .
          python -m compileall -q *.py tests
          for file in static/*.js; do node --check --input-type=module < "$file"; done
          for file in helpers/*.mjs; do node --check "$file"; done
          for file in *.sh; do bash -n "$file"; done
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader

          templates = Path('templates')
          environment = Environment(loader=FileSystemLoader(templates))
          for path in sorted(templates.glob('*.html')):
              environment.get_template(path.name)
          PY
          rm -f "$NIMHUNT_DB_PATH"
          python spoof.py
          python -m pip check
          python -m pip_audit --progress-spinner off
          npm audit --omit=dev --prefix helpers

      - name: Commit verified dependency repair and remove diagnostics
        run: |
          git config user.name "NimHunt Agent"
          git config user.email "actions@users.noreply.github.com"
          git add helpers/package-lock.json
          git rm .github/workflows/diagnose-current-audit.yml
          git rm .github/workflows/repair-postcss-audit-for-location-pr.yml
          git rm -f dependency_audit_diagnostic.txt
          git commit -m "Update PostCSS security lockfile"
          git push origin HEAD:${{ github.head_ref }}
