name: Revise detail map global zoom floor v3
on: [push]
permissions:
  contents: write
jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/detail-map-zoom-limits
          fetch-depth: 0
      - name: Apply revision
        run: |
          grep "echo '" .github/workflows/revise-detail-map-global-zoom-v2.yml | head -1 | sed "s/.*echo '\([^']*\)'.*/\1/" | base64 -d > /tmp/revise_detail_map.py
          python /tmp/revise_detail_map.py
          sed -i 's/in pae/in page/g' tests/test_detail_map_zoom_controls.py
      - name: Validate focused behaviour
        run: |
          python -m pip install -q pytest
          node --check static/spot_detail.js
          node --check static/claim_detail.js
          python -m pytest -q tests/test_detail_map_zoom_controls.py
      - name: Commit revision and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/revise-detail-map-global-zoom.yml .github/workflows/revise-detail-map-global-zoom-v2.yml .github/workflows/revise-detail-map-global-zoom-v3.yml
          git add static/spot_detail.js static/claim_detail.js templates/spot.html templates/claim.html tests/test_detail_map_zoom_controls.py
          git commit -m "Use a global detail map zoom floor"
          git push origin HEAD:agent/detail-map-zoom-limits
