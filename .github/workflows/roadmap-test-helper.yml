name: Roadmap test helper

on:
  push:
    branches:
      - agent/remove-roadmap-asap

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-roadmap-asap
          fetch-depth: 0

      - name: Update roadmap expectation
        run: python -c "from pathlib import Path; p=Path('tests/test_static_pages.py'); t=p.read_text(encoding='utf-8'); old='            {\\n                \\\"heading\\\": \\\"ASAP\\\",\\n                \\\"items\\\": [\\\"Full release on NIMIQ blockchain\\\"],\\n            },\\n'; assert old in t; p.write_text(t.replace(old, '', 1), encoding='utf-8')"

      - name: Validate focused roadmap test
        run: python -m pytest tests/test_static_pages.py -q

      - name: Commit test update and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/roadmap-test-helper.yml
          git add tests/test_static_pages.py
          git commit -m "Update roadmap test after removing ASAP section"
          git push origin HEAD:agent/remove-roadmap-asap
