name: RPC diagnostic

on:
  push:
    branches:
      - agent/fix-mainnet-rpc-startup
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --prefix helpers
      - name: Probe public RPC response shapes
        run: |
          python - <<'PY' > rpc-diagnostic.txt
          import json
          import urllib.error
          import urllib.request

          endpoints = {
              "mainnet": "https://rpc.nimiqwatch.com/",
              "testnet": "https://rpc.testnet.nimiqwatch.com/",
          }
          calls = (
              ("getNetworkId", []),
              ("getLatestBlock", [False]),
              ("getBlockNumber", []),
          )
          for label, url in endpoints.items():
              print(f"ENDPOINT {label} {url}")
              for method, params in calls:
                  payload = json.dumps({"jsonrpc": "2.0", "id": 1, "method": method, "params": params}).encode()
                  request = urllib.request.Request(url, data=payload, headers={"Content-Type": "application/json"}, method="POST")
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          body = response.read().decode()
                          print(method, "HTTP", response.status, body[:1500])
                  except urllib.error.HTTPError as exc:
                      print(method, "HTTP", exc.code, exc.read().decode()[:1500])
          PY
          cat rpc-diagnostic.txt
      - name: Run current NimHunt mainnet RPC startup proof
        env:
          NIMHUNT_DEPLOYMENT_MODE: production
          NIMHUNT_DB_PATH: /tmp/nimhunt-rpc-diagnostic.db
          NIMHUNT_NIMIQ_NETWORK: MainAlbatross
          NIMHUNT_NIMIQ_NETWORK_ID: "24"
          NIMHUNT_NIMIQ_RPC_URL: https://rpc.nimiqwatch.com/
          NIMHUNT_NIMIQ_HUB_URL: https://hub.nimiq.com
          NIMHUNT_NIMIQ_MNEMONIC: diagnostic-only-not-used
          NIMHUNT_NIMIQ_DERIVE_ADDRESS_COMMAND: node helpers/nimiq_helper.mjs
          NIMHUNT_NIMIQ_SEND_COMMAND: node helpers/nimiq_helper.mjs
          NIMHUNT_SPOT_FEE_ADDRESS: NQ45 1KUT 73F7 ADV4 UCT8 TX64 2DE4 CHBP SJBF
        run: |
          python - <<'PY' >> rpc-diagnostic.txt
          import asyncio
          import main

          print("CURRENT_STARTUP_RPC_PROOF")
          result = asyncio.run(main.verify_public_rpc_network())
          print("SUCCESS", result)
          PY
          cat rpc-diagnostic.txt
      - name: Run complete production startup with bundled signer
        env:
          NIMHUNT_DEPLOYMENT_MODE: production
          NIMHUNT_DB_PATH: /tmp/nimhunt-full-startup.db
          NIMHUNT_NIMIQ_NETWORK: MainAlbatross
          NIMHUNT_NIMIQ_NETWORK_ID: "24"
          NIMHUNT_NIMIQ_RPC_URL: https://rpc.nimiqwatch.com/
          NIMHUNT_NIMIQ_HUB_URL: https://hub.nimiq.com
          NIMHUNT_NIMIQ_MNEMONIC: legal winner thank year wave sausage worth useful legal winner thank yellow
          NIMHUNT_NIMIQ_DERIVE_ADDRESS_COMMAND: node helpers/nimiq_helper.mjs
          NIMHUNT_NIMIQ_SEND_COMMAND: node helpers/nimiq_helper.mjs
          NIMHUNT_SPOT_FEE_ADDRESS: NQ45 1KUT 73F7 ADV4 UCT8 TX64 2DE4 CHBP SJBF
          NIMHUNT_X_AUTO_POST_ENABLED: "false"
        run: |
          python - <<'PY' >> rpc-diagnostic.txt
          import asyncio
          import traceback
          import main

          async def run():
              print("FULL_PRODUCTION_STARTUP", flush=True)
              try:
                  main.validate_deployment_safety()
                  print("deployment_safety=ok", flush=True)
                  main.verify_public_signing_access()
                  print("signer_validation=ok", flush=True)
                  await main.verify_public_rpc_network()
                  print("rpc_network=ok", flush=True)
                  await main.startup()
                  print("full_startup=ok", flush=True)
              except Exception as exc:
                  print(f"full_startup_error={type(exc).__name__}: {exc}", flush=True)
                  print(traceback.format_exc(), flush=True)
                  raise
              finally:
                  await main.shutdown()
                  print("shutdown=ok", flush=True)

          asyncio.run(run())
          PY
          cat rpc-diagnostic.txt
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rpc-diagnostic
          path: rpc-diagnostic.txt
