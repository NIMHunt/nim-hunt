name: Run financial hardening

on:
  push:
    branches:
      - agent/harden-financial-finality

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/harden-financial-finality
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply reviewed patch
        run: python .financial-hardening-patch.py

      - name: Check Python syntax
        run: |
          python -m py_compile database.py db_access.py trans_updater.py settlement_updater.py public_html.py main.py constants.py spoof.py tests/test_financial_finality.py

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Validate scripts and diff
        run: |
          bash -n nimhunt_start_dev.sh
          bash -n nimhunt_reset_mock_data.sh
          node --check helpers/nimiq_helper.mjs
          git diff --check

      - name: Commit tested changes
        shell: bash
        run: |
          rm -f .github/workflows/financial-hardening.yml
          rm -f .github/workflows/run-financial-hardening.yml
          rm -f .financial-hardening-report.txt
          rm -f .financial-hardening-trigger .financial-hardening-trigger-2
          rm -f .financial-hardening-payload .financial-hardening-patch.py
          git config user.name "NimHunt Review Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Harden transaction finality and standard payouts"
          git push origin HEAD:agent/harden-financial-finality
