name: Run minor UI patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/desktop-location-lock-spacing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/desktop-location-lock-spacing
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm ci --prefix helpers

      - name: Apply patch
        run: python tools/apply_minor_ui_refresh_fix.py

      - name: Remove temporary machinery
        run: |
          rm .github/workflows/apply_minor_ui_refresh_fix.yml
          rm .github/workflows/run_minor_ui_fix.yml
          rm tools/apply_minor_ui_refresh_fix.py
          rm -f tools/trigger_minor_ui_fix.txt

      - name: Validate focused changes
        run: |
          pytest -q tests/test_page_lifecycle.py tests/test_presentation_spots.py tests/test_home_disclaimer.py
          node --check --input-type=module < static/page_lifecycle.js
          node --check --input-type=module < static/spot_ui.js
          python -m compileall -q .
          git diff --check

      - name: Commit final result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix denied-location refresh and title lock layout"
          git push origin HEAD:agent/desktop-location-lock-spacing
