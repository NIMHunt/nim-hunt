name: Run minor UI patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/desktop-location-lock-spacing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/desktop-location-lock-spacing
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Refresh patch base label
        run: |
          sed -i 's/presentation-spots-v1-20260722/orange-disclaimer-history-v1-20260722/' tools/apply_minor_ui_refresh_fix.py

      - name: Apply patch
        id: patch
        continue-on-error: true
        run: python tools/apply_minor_ui_refresh_fix.py > patch-output.txt 2>&1

      - name: Correct initial pageshow simulation
        if: steps.patch.outcome == 'success'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_page_lifecycle.py')
          text = path.read_text(encoding='utf-8')
          old = """                performanceObj: backForwardPerformance,
                MutationObserverClass: LifecycleMutationObserver,"""
          new = """                performanceObj: {{ getEntriesByType: () => [{{ type: 'navigate' }}] }},
                MutationObserverClass: LifecycleMutationObserver,"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one tracked performance block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minor-ui-patch-output
          path: patch-output.txt

      - name: Stop on patch failure
        if: steps.patch.outcome == 'failure'
        run: exit 1

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm ci --prefix helpers

      - name: Validate focused changes
        id: validation
        continue-on-error: true
        run: |
          {
            pytest -q tests/test_page_lifecycle.py tests/test_presentation_spots.py tests/test_home_disclaimer.py
            node --check --input-type=module < static/page_lifecycle.js
            node --check --input-type=module < static/spot_ui.js
            python -m compileall -q .
            git diff --check
          } > validation-output.txt 2>&1

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minor-ui-validation-output
          path: validation-output.txt

      - name: Stop on validation failure
        if: steps.validation.outcome == 'failure'
        run: exit 1

      - name: Remove temporary machinery
        run: |
          rm .github/workflows/apply_minor_ui_refresh_fix.yml
          rm .github/workflows/run_minor_ui_fix.yml
          rm tools/apply_minor_ui_refresh_fix.py
          rm -f tools/trigger_minor_ui_fix.txt
          rm -f patch-output.txt validation-output.txt

      - name: Commit final result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix denied-location refresh and title lock layout"
          git push origin HEAD:agent/desktop-location-lock-spacing
