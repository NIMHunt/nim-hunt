name: Temporary Claim badge lint diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/fix-my-claims-badge-shorthand'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Capture Ruff output
        shell: bash
        run: |
          set +e
          ruff check . > /tmp/claim-badge-ruff.log 2>&1
          echo "$?" > /tmp/claim-badge-ruff.exit
          cat /tmp/claim-badge-ruff.log
          exit 0

      - name: Upload Ruff output
        uses: actions/upload-artifact@v4
        with:
          name: claim-badge-ruff-output
          path: |
            /tmp/claim-badge-ruff.log
            /tmp/claim-badge-ruff.exit
          retention-days: 1
