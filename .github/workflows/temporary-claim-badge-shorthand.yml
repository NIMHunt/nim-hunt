name: Temporary claim badge shorthand patch

on:
  push:
    branches:
      - agent/claim-badge-status-shorthand

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out review branch
        uses: actions/checkout@v6
        with:
          ref: agent/claim-badge-status-shorthand
          fetch-depth: 0

      - name: Apply narrow presentation change
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script_path = Path('static/claim_detail.js')
          source = script_path.read_text(encoding='utf-8')

          status_function = """function claimStatusText(claim) {
              if (typeof claim.display_status_text === 'string' && claim.display_status_text.trim()) {
                  return claim.display_status_text;
              }
              if (claim.status_label === 'success') return TEXT.status.success;
              if (claim.status_label === 'failed') return TEXT.status.failed;
              return TEXT.status.pending;
          }
          """
          compact_function = status_function + """
          function claimBadgeText(claim) {
              return claimStatusText(claim).replace(/\\s*\\([^)]*\\)\\s*$/, '').trim();
          }
          """
          if status_function not in source:
              raise SystemExit('claimStatusText function did not match the reviewed source')
          source = source.replace(status_function, compact_function, 1)

          old_badge = "    badge.textContent = claimStatusText(claim);"
          new_badge = "    badge.textContent = claimBadgeText(claim);"
          if source.count(old_badge) != 1:
              raise SystemExit('expected exactly one Claim badge assignment')
          source = source.replace(old_badge, new_badge, 1)
          script_path.write_text(source, encoding='utf-8')

          template_path = Path('templates/claim.html')
          template = template_path.read_text(encoding='utf-8')
          old_asset = '/static/claim_detail.js?v=claim-confetti-v2-20260720-{{ asset_version | default(\'claim-polish-v2-20260704\') }}'
          new_asset = '/static/claim_detail.js?v=claim-badge-v1-20260726-{{ asset_version | default(\'claim-polish-v2-20260704\') }}'
          if template.count(old_asset) != 1:
              raise SystemExit('Claim detail asset reference did not match the reviewed template')
          template_path.write_text(template.replace(old_asset, new_asset, 1), encoding='utf-8')

          test_path = Path('tests/test_claim_badge_status.py')
          test_path.write_text("""from pathlib import Path


CLAIM_DETAIL_SCRIPT = Path(\"static/claim_detail.js\")
CLAIM_TEMPLATE = Path(\"templates/claim.html\")


def test_claim_badge_omits_only_trailing_parenthetical_detail():
    source = CLAIM_DETAIL_SCRIPT.read_text(encoding=\"utf-8\")

    assert \"function claimBadgeText(claim)\" in source
    assert \"claimStatusText(claim).replace(/\\\\s*\\\\([^)]*\\\\)\\\\s*$/, '').trim()\" in source
    assert \"badge.textContent = claimBadgeText(claim);\" in source


def test_detailed_claim_status_keeps_the_full_status_formatter():
    source = CLAIM_DETAIL_SCRIPT.read_text(encoding=\"utf-8\")

    assert \"appendBulletLine(lines, TEXT.statusLabel, buildStatusWithTimer(claim));\" in source
    assert \"keyword.textContent = text || claimStatusText(claim);\" in source
    assert \"badge.textContent = claimStatusText(claim);\" not in source


def test_claim_page_refreshes_the_changed_script():
    template = CLAIM_TEMPLATE.read_text(encoding=\"utf-8\")

    assert \"claim-badge-v1-20260726\" in template
""", encoding='utf-8')
          PY

          rm -f .github/workflows/temporary-claim-badge-shorthand.yml
          git config user.name 'NIMHunt'
          git config user.email 'noreply@nimhunt.app'
          git add static/claim_detail.js templates/claim.html tests/test_claim_badge_status.py .github/workflows
          git commit -m 'Shorten detailed Claim status badges'
          git push origin HEAD:agent/claim-badge-status-shorthand
