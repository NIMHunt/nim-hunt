name: Temporary pre-launch repository export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create source archive
        run: tar --exclude=.git --exclude=nimhunt-source.tar.gz -czf nimhunt-source.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: nimhunt-prelaunch-source
          path: nimhunt-source.tar.gz
          retention-days: 1
