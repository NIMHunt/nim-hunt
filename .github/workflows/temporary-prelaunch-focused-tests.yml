name: Temporary pre-launch focused tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  focused:
    if: github.event.pull_request.head.ref == 'agent/prelaunch-transaction-review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Capture focused test output
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_prelaunch_financial_concurrency.py")
          text = path.read_text()
          marker = "        self.assertEqual(len(sends), 2)\n"
          text = text.replace(
              marker,
              "        print('DEBUG_SETTLEMENT_RESULTS', results)\n" + marker,
              1,
          )
          path.write_text(text)
          PY
          set +e
          python -m pytest -vv -s tests/test_prelaunch_financial_concurrency.py tests/test_prelaunch_financial_health.py > /tmp/prelaunch-focused.log 2>&1
          code=$?
          cat /tmp/prelaunch-focused.log
          echo "$code" > /tmp/prelaunch-focused.exit
          exit 0

      - name: Upload focused test output
        uses: actions/upload-artifact@v4
        with:
          name: prelaunch-focused-test-output
          path: |
            /tmp/prelaunch-focused.log
            /tmp/prelaunch-focused.exit
          retention-days: 1
