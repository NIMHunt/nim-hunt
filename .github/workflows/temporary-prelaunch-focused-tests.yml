name: Temporary apply Prizedraw payout lock fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/prelaunch-transaction-review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out review branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Serialize payout retry preparation and remove workflow
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("settlement_updater.py")
          text = path.read_text()
          anchor = "async def retry_pending_prizedraw_payouts_for_spot(*, spot_id: int) -> RowDict:"
          start = text.index(anchor)
          target = "            async with db_access.transaction(db):"
          position = text.index(target, start)
          replacement = (
              "            # Reserve before reading payout jobs so concurrent settlement/retry\n"
              "            # workers wait instead of upgrading a stale read transaction into SQLITE_BUSY.\n"
              "            async with db_access.transaction(db, immediate=True):"
          )
          text = text[:position] + replacement + text[position + len(target):]
          path.write_text(text)
          PY
          rm .github/workflows/temporary-prelaunch-focused-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add settlement_updater.py .github/workflows/temporary-prelaunch-focused-tests.yml
          git commit -m "Serialize Prizedraw payout retry preparation"
          git push origin "HEAD:${HEAD_BRANCH}"
