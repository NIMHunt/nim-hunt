name: Temporary remainder refund lint

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    if: github.event.pull_request.head.ref == 'agent/prelaunch-transaction-review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Capture Ruff output
        shell: bash
        run: |
          set +e
          ruff check . > /tmp/remainder-ruff.log 2>&1
          code=$?
          cat /tmp/remainder-ruff.log
          echo "$code" > /tmp/remainder-ruff.exit
          exit 0

      - name: Upload Ruff output
        uses: actions/upload-artifact@v4
        with:
          name: remainder-ruff-output
          path: |
            /tmp/remainder-ruff.log
            /tmp/remainder-ruff.exit
          retention-days: 1
