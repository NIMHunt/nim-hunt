name: Temporary apply Ruff import formatting

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/prelaunch-transaction-review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out review branch
        uses: actions/checkout@v6
        with:
          ref: agent/prelaunch-transaction-review
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install -r requirements-dev.txt

      - name: Apply Ruff and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          ruff check --select I --fix tests/test_spot_remainder_refunds.py
          ruff check .
          rm -f .github/workflows/temporary-remainder-lint.yml
          git config user.name 'NIMHunt'
          git config user.email 'noreply@nimhunt.app'
          git add tests/test_spot_remainder_refunds.py .github/workflows/temporary-remainder-lint.yml
          git commit -m 'Format remainder refund tests'
          git push origin HEAD:agent/prelaunch-transaction-review
