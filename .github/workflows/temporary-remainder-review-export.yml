name: Temporary diagnose remainder refund patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/prelaunch-transaction-review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out review branch
        uses: actions/checkout@v6
        with:
          ref: agent/prelaunch-transaction-review

      - name: Assemble staged patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/remainder-patch/part* | base64 -d > /tmp/remainder.patch
          sha256sum /tmp/remainder.patch | tee /tmp/remainder.sha256

      - name: Upload assembled patch
        uses: actions/upload-artifact@v4
        with:
          name: assembled-remainder-patch
          path: |
            /tmp/remainder.patch
            /tmp/remainder.sha256
          retention-days: 1
