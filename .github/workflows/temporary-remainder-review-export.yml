name: Temporary remainder review export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/prelaunch-transaction-review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create source archive
        run: tar --exclude=.git -czf /tmp/nimhunt-remainder-source.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: nimhunt-remainder-source
          path: /tmp/nimhunt-remainder-source.tar.gz
          retention-days: 1
