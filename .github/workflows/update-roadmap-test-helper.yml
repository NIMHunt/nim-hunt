name: Update roadmap test helper

on:
  push:
    branches:
      - agent/remove-roadmap-asap

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-roadmap-asap
          fetch-depth: 0

      - name: Update roadmap expectation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_static_pages.py')
          text = path.read_text(encoding='utf-8')
          old = '''            {
              "heading": "ASAP",
              "items": ["Full release on NIMIQ blockchain"],
            },
'''
          if old not in text:
              raise SystemExit('Expected ASAP test block not found')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY

      - name: Validate focused roadmap test
        run: |
          python -m pytest tests/test_static_pages.py -q

      - name: Commit test update and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-roadmap-test-helper.yml
          git add tests/test_static_pages.py
          git commit -m "Update roadmap test after removing ASAP section"
          git push origin HEAD:agent/remove-roadmap-asap
