name: Verify live special user deployment

on:
  push:
    branches:
      - agent/verify-live-special-user
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe public deployment
        env:
          BASE_URL: https://nimhunt.app
          SPOT_SLUG: GLqKYswoYdo
        run: curl -fsSL https://raw.githubusercontent.com/NIMHunt/nim-hunt/agent/verify-live-special-user/.github/verify_live_special_user.py | python
