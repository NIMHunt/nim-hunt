name: Inspect Spot creation fee transfer

on:
  pull_request:
    branches:
      - agent/public-testnet-deployment

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out stacked branch
        uses: actions/checkout@v4
        with:
          ref: agent/spot-creation-fees
      - name: Archive exact branch
        run: |
          tar \
            --exclude=.git \
            --exclude=venv \
            --exclude='**/__pycache__' \
            --exclude='*.pyc' \
            --exclude=records.db \
            -czf /tmp/nimhunt-pr12-inspect.tar.gz .
      - name: Upload inspection archive
        uses: actions/upload-artifact@v4
        with:
          name: nimhunt-pr12-inspect
          path: /tmp/nimhunt-pr12-inspect.tar.gz
          retention-days: 1
